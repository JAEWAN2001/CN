","options":[{"id":"o0","text":"라우터","why":"서로 다른 네트워크를 연결하고 IP 주소에 따라 전달 경로를 선택한다."},{"id":"o1","text":"게이트웨이","why":"서로 다른 종류·프로토콜의 네트워크 사이에서 프로토콜을 변환하여 정보를 교환한다."},{"id":"o2","text":"중계기","why":"약해진 신호를 복원·증폭하여 다음 구간으로 재전송하고 거리를 연장한다."},{"id":"o3","text":"AP","why":"무선 단말에 유선 이더넷 네트워크 접근을 제공하는 접속점이다."},{"id":"o4","text":"스위치","why":"한 네트워크 내부에서 프레임을 전달하며 수신지 MAC과 포트 정보를 활용한다."}],"answer":"o3","explanation":"무선 단말에 유선 이더넷 네트워크 접근을 제공하는 접속점이다.","sources":[{"doc":"G2","pages":[35,36]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q045","chapter":2,"topics":["2-09"],"priority":"핵심","kind":"비교","level":"기본","stem":"무선 기능이 통합된 라우터에 대한 교안의 설명으로 옳은 것은?","options":[{"id":"o0","text":"라우터에 무선 기능이 있어도 모든 경우 AP를 추가해야만 한다.","why":"무선 기능을 통합한 경우 별도 AP가 필요하지 않다는 설명과 다르다."},{"id":"o1","text":"AP는 컴퓨터의 문자 코드를 바꾸는 장치이다.","why":"AP의 역할은 무선 단말의 네트워크 접속이다."},{"id":"o2","text":"무선 기능이 있으면 유선망과는 절대 연결될 수 없다.","why":"유무선 연결을 제공하는 구성을 배제한 잘못된 단정이다."},{"id":"o3","text":"무선 라우터는 전송매체로 오직 광섬유만 사용한다.","why":"무선 접속에 대한 문제 조건과 맞지 않는다."},{"id":"o4","text":"무선 접속 기능을 갖추고 있어 별도 AP 없이 무선 접속을 제공할 수 있다.","why":"교안은 별도 AP를 연결하는 경우와 라우터가 무선 기능을 통합한 경우를 구분한다."}],"answer":"o4","explanation":"교안은 별도 AP를 연결하는 경우와 라우터가 무선 기능을 통합한 경우를 구분한다.","sources":[{"doc":"G2","pages":[36]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q046","chapter":2,"topics":["2-15"],"priority":"확장","kind":"개념","level":"표준","stem":"라우터의 라우팅 테이블이 전달 과정에서 제공하는 정보는?","options":[{"id":"o0","text":"수신지 주소에 따라 다음 전달 주소와 경로를 결정하는 정보","why":"교안은 라우팅 테이블을 수신지에 대한 다음 전달 주소·경로 결정에 사용하는 것으로 설명한다."},{"id":"o1","text":"패리티를 제외한 문자 코드만 모은 표","why":"오류 검사나 문자 코드와 다른 용도이다."},{"id":"o2","text":"수신지와 관계없는 무작위 문자 목록","why":"경로 결정을 위해 주소 정보를 활용한다는 핵심이 빠졌다."},{"id":"o3","text":"컴퓨터 화면의 색상을 고르는 표","why":"네트워크 전달 경로와 무관하다."},{"id":"o4","text":"모든 사용자의 문서 내용을 한 글자씩 저장한 표","why":"라우팅 테이블은 애플리케이션 문서 저장 표가 아니다."}],"answer":"o0","explanation":"교안은 라우팅 테이블을 수신지에 대한 다음 전달 주소·경로 결정에 사용하는 것으로 설명한다.","sources":[{"doc":"G2","pages":[33]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q047","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"개념","level":"기본","stem":"네트워크 토폴로지의 뜻으로 적절한 것은?","options":[{"id":"o0","text":"모든 패킷의 데이터 내용","why":"데이터 내용과 네트워크 연결 형태는 다르다."},{"id":"o1","text":"노드와 링크의 물리적 또는 논리적 연결 방식","why":"토폴로지는 장치가 어떻게 연결되는가에 관한 것이다. 책상 위 배치 모습만을 뜻하지 않는다."},{"id":"o2","text":"한 문자의 ASCII 숫자만","why":"문자 코드와 네트워크 접속 형태는 다른 개념이다."},{"id":"o3","text":"책상 위 컴퓨터의 색상 배열만","why":"물리적 또는 논리적 연결 관계를 제외한 설명이다."},{"id":"o4","text":"신호의 높이만","why":"신호 높이는 진폭이다."}],"answer":"o1","explanation":"토폴로지는 장치가 어떻게 연결되는가에 관한 것이다. 책상 위 배치 모습만을 뜻하지 않는다.","sources":[{"doc":"G2","pages":[37]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q048","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"상황","level":"표준","stem":"중앙 스위치는 정상인 성형 네트워크에서 한 PC로 이어진 개별 링크만 끊어졌다. 교안상 예상되는 영향은?","options":[{"id":"o0","text":"항상 모든 PC의 통신이 동시에 중단된다.","why":"이것은 중앙 장치 장애와 개별 링크 장애를 혼동한 설명이다."},{"id":"o1","text":"전체가 즉시 완전 그물형으로 바뀐다.","why":"장애가 토폴로지를 자동으로 바꾸지는 않는다."},{"id":"o2","text":"그 링크에 연결된 PC의 통신이 주로 영향을 받는다.","why":"성형에서 개별 배선 장애와 중앙 장치 장애를 구분한다. 정상인 중앙 장치에 연결된 다른 링크는 영향을 받지 않는 것으로 설명된다."},{"id":"o3","text":"끊어진 링크의 PC도 아무 영향이 없다.","why":"해당 링크를 통한 통신 경로가 끊어졌다."},{"id":"o4","text":"모든 MAC 주소 길이가 32비트로 바뀐다.","why":"물리적 연결 장애와 주소 길이는 무관하다."}],"answer":"o2","explanation":"성형에서 개별 배선 장애와 중앙 장치 장애를 구분한다. 정상인 중앙 장치에 연결된 다른 링크는 영향을 받지 않는 것으로 설명된다.","sources":[{"doc":"G2","pages":[38,39]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q049","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"상황","level":"기본","stem":"중앙 장치 하나의 고장이 전체 네트워크에 영향을 주는 성형의 약점은?","options":[{"id":"o0","text":"노드 추가가 정의상 영원히 불가능하다는 점","why":"교안은 성형의 유지보수·확장이 용이하다고 설명한다."},{"id":"o1","text":"각 노드가 모든 다른 노드와 직접 연결된다는 점","why":"완전 그물형의 연결 방식이다."},{"id":"o2","text":"모든 링크가 항상 한 방향 링이라는 점","why":"링형과 성형을 혼동한 것이다."},{"id":"o3","text":"중앙 장치에 대한 의존성","why":"모든 노드가 중앙 장치를 통해 연결되므로 중앙 장치 장애의 영향이 크다."},{"id":"o4","text":"중앙 장치가 존재하지 않는다는 점","why":"성형에는 중앙 허브 등의 장치가 있다."}],"answer":"o3","explanation":"모든 노드가 중앙 장치를 통해 연결되므로 중앙 장치 장애의 영향이 크다.","sources":[{"doc":"G2","pages":[39]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q050","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"개념","level":"기본","stem":"버스형에서 케이블 양 끝에 터미네이터를 붙이는 직접적인 이유는?","options":[{"id":"o0","text":"패킷을 문자별로 암호화하기 위해서","why":"신호 종단과 암호화는 다른 기능이다."},{"id":"o1","text":"비트율과 주파수를 항상 같은 값으로 만들기 위해서","why":"신호 반사 방지와 단위·수치 동일화는 무관하다."},{"id":"o2","text":"중앙 허브에서 MAC을 학습하기 위해서","why":"버스 끝의 종단 장치는 MAC 학습 장치가 아니다."},{"id":"o3","text":"모든 PC의 IP 주소를 새로 만들기 위해서","why":"주소 할당은 터미네이터의 정의가 아니다."},{"id":"o4","text":"신호가 끝에서 되돌아오는 반사를 막기 위해서","why":"버스의 양 끝에서 신호가 케이블로 되돌아오지 않도록 하는 종단 장치이다."}],"answer":"o4","explanation":"버스의 양 끝에서 신호가 케이블로 되돌아오지 않도록 하는 종단 장치이다.","sources":[{"doc":"G2","pages":[40]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q051","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"상황","level":"표준","stem":"버스형의 개별 장치가 아니라 공통 중추 케이블이 파손되었을 때 교안상 가장 적절한 설명은?","options":[{"id":"o0","text":"네트워크 전체 통신에 장애가 발생할 수 있다.","why":"공통 버스는 여러 노드의 공유 전송로이므로 그 파손은 광범위한 통신 장애로 이어진다."},{"id":"o1","text":"PHY 없이 응용 계층만으로 물리적 단절을 해결한다.","why":"물리적 통로의 단절을 상위 계층 명칭만으로 없앨 수 없다."},{"id":"o2","text":"파손된 버스도 정상 케이블과 완전히 같다.","why":"교안은 버스 케이블 파손 시 전송 중단을 설명한다."},{"id":"o3","text":"항상 특정 PC의 키보드 입력에만 영향이 있다.","why":"공유 전송로의 장애를 주변장치 하나의 문제로 축소했다."},{"id":"o4","text":"다른 모든 링크가 독립 전용선이므로 영향이 없다.","why":"그물형의 전용 연결을 버스형에 잘못 적용했다."}],"answer":"o0","explanation":"공통 버스는 여러 노드의 공유 전송로이므로 그 파손은 광범위한 통신 장애로 이어진다.","sources":[{"doc":"G2","pages":[41]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q052","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"상황","level":"기본","stem":"상위 노드가 하위 노드를 제어하는 계층적 구조이고, 상위 구간의 트래픽 집중이 약점인 접속 형태는?","options":[{"id":"o0","text":"단순 링형","why":"각 노드가 두 이웃과 연결되어 하나의 링을 이루는 형태이다."},{"id":"o1","text":"트리형","why":"트리형은 계층적 연결·제어와 확장이 특징이며, 상위/중앙 장치에 트래픽이 집중되어 병목이 생길 수 있다."},{"id":"o2","text":"완전 그물형","why":"모든 노드 쌍이 전용 점대점으로 연결되는 형태이다."},{"id":"o3","text":"서로 연결되지 않은 독립 PC","why":"노드 간 계층적 네트워크가 존재하지 않는다."},{"id":"o4","text":"공유 케이블 하나만 있는 순수 버스형","why":"문제의 상하 계층적 분기와 제어를 설명하지 못한다."}],"answer":"o1","explanation":"트리형은 계층적 연결·제어와 확장이 특징이며, 상위/중앙 장치에 트래픽이 집중되어 병목이 생길 수 있다.","sources":[{"doc":"G2","pages":[42,43]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q053","chapter":2,"topics":["2-01"],"priority":"핵심","kind":"비교","level":"표준","stem":"링형의 구조와 단순 링의 장애 영향을 바르게 연결한 것은?","options":[{"id":"o0","text":"모든 노드 쌍이 직접 연결 / 링크 수가 항상 1개","why":"완전 그물형 설명과도 맞지 않으며 링형 구조가 아니다."},{"id":"o1","text":"모든 노드가 한 케이블에 분기 / 양 끝에 종단 장치","why":"버스형의 구조이다."},{"id":"o2","text":"각 노드가 두 이웃과 연결 / 단순 링의 단절은 전체 통신에 영향","why":"교안은 각 노드가 인접 두 노드와 연결되며 단순 링의 결함으로 전체 사용이 어려워질 수 있다고 설명한다."},{"id":"o3","text":"중앙 허브에만 연결 / 중앙 허브가 반드시 없음","why":"서로 모순되는 성형 관련 설명이다."},{"id":"o4","text":"단순 링은 어떤 단절이 생겨도 항상 완전히 정상","why":"교안이 제시한 단순 링의 단점을 부정한다."}],"answer":"o2","explanation":"교안은 각 노드가 인접 두 노드와 연결되며 단순 링의 결함으로 전체 사용이 어려워질 수 있다고 설명한다.","sources":[{"doc":"G2","pages":[44,45]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q054","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"개념","level":"표준","stem":"완전 그물형의 링크 수를 n(n−1)/2로 계산할 때 2로 나누는 이유는?","options":[{"id":"o0","text":"항상 노드가 정확히 두 개뿐이기 때문이다.","why":"n개의 노드를 대상으로 하는 일반식이다."},{"id":"o1","text":"각 링크가 반드시 단방향 두 개의 메시지를 버리기 때문이다.","why":"메시지 폐기와 무관한 조합 계산이다."},{"id":"o2","text":"링크의 절반은 아무 이유 없이 버려야 하기 때문이다.","why":"중복 계산을 제거하는 것이지 실제 링크를 삭제하는 것이 아니다."},{"id":"o3","text":"각 노드에서 연결을 세면 동일한 무방향 링크를 양 끝에서 두 번 세기 때문이다.","why":"각 노드는 n−1개 다른 노드와 연결된다. n(n−1)은 A–B와 B–A를 중복하여 세므로 2로 나눈다."},{"id":"o4","text":"모든 링크가 두 배의 속도를 가지기 때문이다.","why":"연결 수와 전송속도를 혼동한 설명이다."}],"answer":"o3","explanation":"각 노드는 n−1개 다른 노드와 연결된다. n(n−1)은 A–B와 B–A를 중복하여 세므로 2로 나눈다.","sources":[{"doc":"G2","pages":[46]},{"doc":"FULL","pages":[12]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q055","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"상황","level":"기본","stem":"일부 회선 고장 시 우회 경로를 이용하기 쉽지만 연결 수·포트·배선 비용이 큰 접속 형태는?","options":[{"id":"o0","text":"컴퓨터의 ASCII 표","why":"접속 형태가 아니다."},{"id":"o1","text":"공유 케이블 한 개의 버스형","why":"공유 케이블 하나라는 점에서 다수 전용 연결 설명과 다르다."},{"id":"o2","text":"중앙 장치 하나에만 의존하는 성형","why":"문제는 여러 전용 경로와 높은 연결 비용을 함께 묻는다."},{"id":"o3","text":"전송매체가 없는 PC 한 대","why":"네트워크의 우회 경로가 존재하지 않는다."},{"id":"o4","text":"그물형","why":"그물형은 다수의 전용 연결로 우회 경로와 신뢰성을 확보하는 대신 비용·설치 부담이 커진다."}],"answer":"o4","explanation":"그물형은 다수의 전용 연결로 우회 경로와 신뢰성을 확보하는 대신 비용·설치 부담이 커진다.","sources":[{"doc":"G2","pages":[46,47]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q056","chapter":2,"topics":["2-13"],"priority":"확장","kind":"개념","level":"기본","stem":"여러 접속 형태를 결합하는 혼합형을 사용하는 교안의 목적은?","options":[{"id":"o0","text":"큰 네트워크의 효율과 결함 허용 능력을 높이고 여러 서브넷을 연결하기 위해서","why":"한 형태만 고집하지 않고 여러 형태의 장점을 결합하여 규모에 맞게 구성한다."},{"id":"o1","text":"데이터를 절대 송수신하지 않기 위해서","why":"네트워크 효율 향상의 목적과 맞지 않는다."},{"id":"o2","text":"모든 네트워크를 완전히 같은 물리적 모양으로 강제하기 위해서","why":"여러 형태를 결합한다는 정의와 반대이다."},{"id":"o3","text":"통신 가능한 노드를 반드시 한 대로 줄이기 위해서","why":"규모가 큰 실제 네트워크 구성과 반대이다."},{"id":"o4","text":"모든 전송매체를 없애기 위해서","why":"서브넷 연결에도 매체가 필요하다."}],"answer":"o0","explanation":"한 형태만 고집하지 않고 여러 형태의 장점을 결합하여 규모에 맞게 구성한다.","sources":[{"doc":"G2","pages":[48,49]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q057","chapter":2,"topics":["2-07"],"priority":"핵심","kind":"비교","level":"기본","stem":"유선 전송매체와 신호 전달 형태를 바르게 연결한 것은?","options":[{"id":"o0","text":"꼬임선: 진공의 전파만 / 광섬유: 종이 기록","why":"꼬임선은 유선 금속 매체이며 광섬유는 빛을 이용한다."},{"id":"o1","text":"동축·꼬임선: 금속성 도선의 전기 신호 / 광섬유: 빛","why":"교안은 동축·꼬임선을 금속 도선, 광섬유를 유리·플라스틱을 통한 빛의 전달로 구분한다."},{"id":"o2","text":"세 매체는 모두 데이터와 무관한 저장장치이다.","why":"모두 송수신 장치 사이의 전송매체이다."},{"id":"o3","text":"동축: 빛만 / 광섬유: 구리선 전류만","why":"두 매체의 전송 형태를 바꿨다."},{"id":"o4","text":"광섬유에는 신호가 전혀 이동하지 않는다.","why":"광섬유는 빛의 형태로 정보를 전송한다."}],"answer":"o1","explanation":"교안은 동축·꼬임선을 금속 도선, 광섬유를 유리·플라스틱을 통한 빛의 전달로 구분한다.","sources":[{"doc":"G2","pages":[51,52,55,58]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q058","chapter":2,"topics":["2-05"],"priority":"핵심","kind":"개념","level":"기본","stem":"꼬임선에서 절연된 두 구리선을 서로 꼬는 주요 이유는?","options":[{"id":"o0","text":"MAC 주소를 IP 주소로 바꾸기 위해서","why":"주소 연계는 꼬임 구조의 기능이 아니다."},{"id":"o1","text":"반드시 두 노드 사이 거리를 무한대로 늘리기 위해서","why":"꼬임으로 거리 제약이 사라지는 것은 아니다."},{"id":"o2","text":"전기적 간섭을 줄이기 위해서","why":"교안은 두 선 사이의 전기적 간섭 최소화를 꼬임의 이유로 제시한다."},{"id":"o3","text":"문자 코드의 비트 수를 0으로 만들기 위해서","why":"물리적 배선과 문자 코드 길이는 다른 개념이다."},{"id":"o4","text":"전기 신호를 전혀 보내지 않기 위해서","why":"꼬임선은 전기 신호를 전달하는 매체이다."}],"answer":"o2","explanation":"교안은 두 선 사이의 전기적 간섭 최소화를 꼬임의 이유로 제시한다.","sources":[{"doc":"G2","pages":[55]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q059","chapter":2,"topics":["2-05"],"priority":"핵심","kind":"비교","level":"표준","stem":"교안의 UTP·FTP·STP 비교에 맞는 것은?","options":[{"id":"o0","text":"교안의 순서는 UTP→FTP→STP가 간섭에 가장 강하다.","why":"제시된 비교 순서를 반대로 썼다."},{"id":"o1","text":"FTP는 케이블이 아니라 반드시 파일 전송 프로토콜만 뜻한다.","why":"이 문맥의 FTP는 차폐된 꼬임선 종류이다. 같은 약어의 문맥을 구분한다."},{"id":"o2","text":"UTP는 모든 피복과 절연이 전혀 없는 맨 구리선이다.","why":"교안의 별도 피복 없음은 차폐 설명의 문맥이며 꼬임선에는 절연·보호 외피가 있다."},{"id":"o3","text":"UTP는 별도 금속 차폐가 없고, 교안은 간섭 영향이 작은 순서를 STP→FTP→UTP로 제시한다.","why":"별도 차폐의 유무·강화를 비교한 교안의 분류이다. UTP에 보호 외피 자체가 전혀 없다는 의미로 읽지 않는다."},{"id":"o4","text":"세 종류 모두 광섬유만으로 제작한다.","why":"UTP·FTP·STP는 꼬임선의 차폐 관련 분류이다."}],"answer":"o3","explanation":"별도 차폐의 유무·강화를 비교한 교안의 분류이다. UTP에 보호 외피 자체가 전혀 없다는 의미로 읽지 않는다.","sources":[{"doc":"G2","pages":[55,56]},{"doc":"FULL","pages":[13]}],"caution":"첨부 교안의 단순화된 차폐 분류를 기준으로 한다. 제품의 세부 규격표로 일반화하지 않는다.","origin":"첨부 자료 기반 재구성"},{"id":"Q060","chapter":2,"topics":["2-14"],"priority":"확장","kind":"비교","level":"표준","stem":"교안의 무선 매체 설명을 바르게 비교한 것은?","options":[{"id":"o0","text":"라디오파는 유선 꼬임선의 다른 이름이다.","why":"공간을 통해 전파되는 무선파와 금속 매체를 구별한다."},{"id":"o1","text":"두 종류 모두 진공이나 공기에서는 전혀 이동하지 않는다.","why":"무선 매체의 설명과 반대이다."},{"id":"o2","text":"마이크로파는 전송과 무관하고 데이터 보관만 담당한다.","why":"통신·레이더 등에 사용하는 전파이다."},{"id":"o3","text":"마이크로파는 반드시 구리선 내부로만 이동한다.","why":"무선 전파이며 유선 설치가 어려운 곳에 활용하는 예가 제시된다."},{"id":"o4","text":"라디오파는 방향성이 없는 전파로, 마이크로파는 짧은 파장·직진성과 파라볼라 안테나 사용으로 설명한다.","why":"교안의 비교 관점은 방향성, 파장·주파수 특성, 안테나 및 사용 환경이다."}],"answer":"o4","explanation":"교안의 비교 관점은 방향성, 파장·주파수 특성, 안테나 및 사용 환경이다.","sources":[{"doc":"G2","pages":[60,61,62]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q061","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"계산","level":"표준","stem":"모든 노드 쌍을 하나의 무방향 링크로 연결한 완전 그물형에서 노드가 6개이다. 필요한 링크 수는?","options":[{"id":"o0","text":"6개","why":"노드 수와 전체 링크 수를 같다고 보았다."},{"id":"o1","text":"36개","why":"자기 자신과의 연결과 중복을 포함한 계산이다."},{"id":"o2","text":"15개","why":"각 노드는 다른 5개 노드에 연결된다. 전체 6×5에서 중복을 제거하면 6×5/2=15개이다."},{"id":"o3","text":"5개","why":"한 노드에 연결되는 링크 수만 센 값이다."},{"id":"o4","text":"30개","why":"한 링크를 양 끝 노드에서 두 번 세고 2로 나누지 않았다."}],"answer":"o2","explanation":"각 노드는 다른 5개 노드에 연결된다. 전체 6×5에서 중복을 제거하면 6×5/2=15개이다.","sources":[{"doc":"G2","pages":[46]},{"doc":"FULL","pages":[12]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"mesh","n":6,"task":"links"}},{"id":"Q062","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"계산","level":"표준","stem":"모든 노드 쌍을 하나의 무방향 링크로 연결한 완전 그물형에서 노드가 8개이다. 필요한 링크 수는?","options":[{"id":"o0","text":"7개","why":"한 노드에 연결되는 링크 수만 센 값이다."},{"id":"o1","text":"8개","why":"노드 수와 전체 링크 수를 같다고 보았다."},{"id":"o2","text":"64개","why":"자기 자신과의 연결과 중복을 포함한 계산이다."},{"id":"o3","text":"28개","why":"각 노드는 다른 7개 노드에 연결된다. 전체 8×7에서 중복을 제거하면 8×7/2=28개이다."},{"id":"o4","text":"56개","why":"한 링크를 양 끝 노드에서 두 번 세고 2로 나누지 않았다."}],"answer":"o3","explanation":"각 노드는 다른 7개 노드에 연결된다. 전체 8×7에서 중복을 제거하면 8×7/2=28개이다.","sources":[{"doc":"G2","pages":[46]},{"doc":"FULL","pages":[12]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"mesh","n":8,"task":"links"}},{"id":"Q063","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"계산","level":"응용","stem":"완전 그물형의 링크가 21개이다. 모든 서로 다른 노드 쌍마다 링크가 하나라면 노드는 몇 개인가?","options":[{"id":"o0","text":"21개","why":"링크 수를 노드 수로 그대로 읽었다."},{"id":"o1","text":"42개","why":"링크 양 끝의 연결 수를 노드 수로 혼동했다."},{"id":"o2","text":"8개","why":"8×7/2=28개 링크이다."},{"id":"o3","text":"6개","why":"6×5/2=15개 링크로 21개가 아니다."},{"id":"o4","text":"7개","why":"n(n−1)/2=21이므로 n(n−1)=42이다. 7×6=42이므로 노드는 7개이다."}],"answer":"o4","explanation":"n(n−1)/2=21이므로 n(n−1)=42이다. 7×6=42이므로 노드는 7개이다.","sources":[{"doc":"G2","pages":[46]},{"doc":"FULL","pages":[12]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"mesh","n":7,"task":"nodes"}},{"id":"Q064","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"계산","level":"표준","stem":"완전 그물형의 기존 노드 5개를 모두 유지하면서 새 노드 1개를 추가한다. 새로 필요한 링크 수는?","options":[{"id":"o0","text":"5개","why":"새 노드는 기존 5개 노드 각각과 연결하므로 새 링크는 5개이다. 전체 링크가 10개에서 15개로 늘어난다."},{"id":"o1","text":"10개","why":"기존 완전 그물형의 링크 수 5×4/2이다."},{"id":"o2","text":"6개","why":"추가 후 전체 노드 수이며 새 링크 수가 아니다."},{"id":"o3","text":"1개","why":"새 노드 하나라도 기존 모든 노드와 연결해야 한다."},{"id":"o4","text":"15개","why":"확장 후 전체 링크 수 6×5/2이다."}],"answer":"o0","explanation":"새 노드는 기존 5개 노드 각각과 연결하므로 새 링크는 5개이다. 전체 링크가 10개에서 15개로 늘어난다.","sources":[{"doc":"G2","pages":[46]},{"doc":"FULL","pages":[12]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"mesh","n":5,"task":"add"}},{"id":"Q065","chapter":2,"topics":["2-06"],"priority":"핵심","kind":"계산","level":"응용","stem":"7노드 완전 그물형에서 링크 하나의 각 끝은 전용 포트를 하나씩 쓴다. 모든 노드에 필요한 포트의 총수는?","options":[{"id":"o0","text":"7개","why":"노드 수를 포트 수로 혼동했다."},{"id":"o1","text":"42개","why":"노드당 7−1=6개 포트이며 전체는 7×6=42개이다. 링크 21개 × 양 끝 2포트로도 검산한다."},{"id":"o2","text":"21개","why":"링크 수이며 양 끝 포트의 합이 아니다."},{"id":"o3","text":"6개","why":"한 노드의 포트 수만 답했다."},{"id":"o4","text":"49개","why":"자기 자신에 대한 불필요한 포트까지 셌다."}],"answer":"o1","explanation":"노드당 7−1=6개 포트이며 전체는 7×6=42개이다. 링크 21개 × 양 끝 2포트로도 검산한다.","sources":[{"doc":"G2","pages":[46,47]},{"doc":"FULL","pages":[12]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"mesh","n":7,"task":"ports"}},{"id":"Q066","chapter":2,"topics":["2-02"],"priority":"핵심","kind":"계산","level":"표준","stem":"교안의 균등 분할 예를 적용한다. 총 100Mbps의 더미 허브 대역폭을 노드 4개가 똑같이 나누면 노드당 값은?","options":[{"id":"o0","text":"4Mbps","why":"노드 개수를 전송률로 사용했다."},{"id":"o1","text":"400Mbps","why":"전체를 노드 수로 나누지 않고 곱했다."},{"id":"o2","text":"25Mbps","why":"교안의 단순 균등 분할 모델에서 100/4=25Mbps이다. 이 값은 임의의 실제 트래픽에서 각 PC의 처리량을 보장하는 공식이 아니다."},{"id":"o3","text":"50Mbps","why":"노드 2개로 나눈 값이다."},{"id":"o4","text":"100Mbps","why":"포트별 전용 링크를 주는 스위칭 허브 예와 혼동했다."}],"answer":"o2","explanation":"교안의 단순 균등 분할 모델에서 100/4=25Mbps이다. 이 값은 임의의 실제 트래픽에서 각 PC의 처리량을 보장하는 공식이 아니다.","sources":[{"doc":"G2","pages":[21,22]},{"doc":"FULL","pages":[10]}],"caution":"교안의 이상화된 비교 계산이다. 실제 처리량 보장으로 해석하지 않는다.","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"arithmetic","value":25}},{"id":"Q067","chapter":3,"topics":["3-06"],"priority":"핵심","kind":"개념","level":"기본","stem":"수신지 주소로 특정 PC 한 대를 지정하여 보내는 1:1 전송 방식은?","options":[{"id":"o0","text":"유니캐스트","why":"특정한 한 수신자에게 보내는 1:1 전송 방식이다."},{"id":"o1","text":"멀티캐스트","why":"특정 그룹의 수신자들에게 한 번에 전송하는 방식이다."},{"id":"o2","text":"애니캐스트","why":"교안의 설명에서는 수신자 그룹 중 가장 가까운 한 노드로 전송한다."},{"id":"o3","text":"브로드캐스트","why":"로컬 LAN 영역의 모든 단말에 전송하는 방식이다."},{"id":"o4","text":"클라이언트/서버","why":"요청하는 클라이언트와 서비스를 제공하는 서버의 역할 관계를 나타내며, 수신 대상 수에 따른 전송 분류와 구별한다."}],"answer":"o0","explanation":"특정한 한 수신자에게 보내는 1:1 전송 방식이다.","sources":[{"doc":"G3","pages":[5,6]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q068","chapter":3,"topics":["3-06"],"priority":"핵심","kind":"개념","level":"기본","stem":"로컬 LAN의 모든 단말에 보내는 브로드캐스트의 수신지 MAC 주소는?","options":[{"id":"o0","text":"00-00-00-00-00-00","why":"모든 비트가 0인 값이며 교안의 브로드캐스트 주소와 다르다."},{"id":"o1","text":"FF-FF-FF-FF-FF-FF","why":"교안이 제시한 브로드캐스트 MAC 주소는 모든 비트가 1인 FF-FF-FF-FF-FF-FF이다."},{"id":"o2","text":"192.168.35.1","why":"교안의 특정 공유기 IP 예시이지 브로드캐스트 MAC 주소가 아니다."},{"id":"o3","text":"FF-FF-FF","why":"48비트 MAC 주소 전체가 아니라 3바이트만 적은 값이다."},{"id":"o4","text":"127.0.0.1","why":"교안의 루프백 IP 주소이며 MAC 주소 표현도 아니다."}],"answer":"o1","explanation":"교안이 제시한 브로드캐스트 MAC 주소는 모든 비트가 1인 FF-FF-FF-FF-FF-FF이다.","sources":[{"doc":"G3","pages":[8]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q069","chapter":3,"topics":["3-06"],"priority":"핵심","kind":"상황","level":"표준","stem":"수강생 전체가 아니라 특정 실습 조에만 같은 데이터를 한 번에 전달하려 한다. 수신 대상 기준으로 가장 적절한 방식은?","options":[{"id":"o0","text":"유니캐스트","why":"특정한 한 수신자에게 보내는 1:1 전송 방식이다."},{"id":"o1","text":"클라이언트/서버","why":"요청하는 클라이언트와 서비스를 제공하는 서버의 역할 관계를 나타내며, 수신 대상 수에 따른 전송 분류와 구별한다."},{"id":"o2","text":"멀티캐스트","why":"특정 그룹의 수신자들에게 한 번에 전송하는 방식이다."},{"id":"o3","text":"애니캐스트","why":"교안의 설명에서는 수신자 그룹 중 가장 가까운 한 노드로 전송한다."},{"id":"o4","text":"브로드캐스트","why":"로컬 LAN 영역의 모든 단말에 전송하는 방식이다."}],"answer":"o2","explanation":"특정 그룹의 수신자들에게 한 번에 전송하는 방식이다.","sources":[{"doc":"G3","pages":[5,10]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q070","chapter":3,"topics":["3-06"],"priority":"핵심","kind":"개념","level":"기본","stem":"같은 서비스를 제공하는 수신자 그룹 중 가장 가까운 한 노드에 보내는 방식으로 교안이 소개한 것은?","options":[{"id":"o0","text":"유니캐스트","why":"특정한 한 수신자에게 보내는 1:1 전송 방식이다."},{"id":"o1","text":"멀티캐스트","why":"특정 그룹의 수신자들에게 한 번에 전송하는 방식이다."},{"id":"o2","text":"브로드캐스트","why":"로컬 LAN 영역의 모든 단말에 전송하는 방식이다."},{"id":"o3","text":"애니캐스트","why":"교안의 설명에서는 수신자 그룹 중 가장 가까운 한 노드로 전송한다."},{"id":"o4","text":"클라이언트/서버","why":"요청하는 클라이언트와 서비스를 제공하는 서버의 역할 관계를 나타내며, 수신 대상 수에 따른 전송 분류와 구별한다."}],"answer":"o3","explanation":"교안의 설명에서는 수신자 그룹 중 가장 가까운 한 노드로 전송한다.","sources":[{"doc":"G3","pages":[10]},{"doc":"FULL","pages":[15]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q071","chapter":3,"topics":["3-07"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안에서 라디오 방송을 예로 든 통신 방향 분류는?","options":[{"id":"o0","text":"반이중(Half-duplex)","why":"양방향 통신이 가능하지만 번갈아 송수신한다."},{"id":"o1","text":"병렬 전송","why":"여러 비트를 여러 회선으로 동시에 보내는 비트 전송 방식이다."},{"id":"o2","text":"전이중(Full-duplex)","why":"양방향에서 동시에 송수신한다."},{"id":"o3","text":"멀티캐스트","why":"수신 대상 그룹에 관한 분류이지 송수신 방향 분류가 아니다."},{"id":"o4","text":"단방향(Simplex)","why":"송신·수신 역할이 고정되고 한쪽 방향으로만 데이터를 보내는 방식이다."}],"answer":"o4","explanation":"송신·수신 역할이 고정되고 한쪽 방향으로만 데이터를 보내는 방식이다.","sources":[{"doc":"G3","pages":[11,12]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q072","chapter":3,"topics":["3-07"],"priority":"핵심","kind":"상황","level":"기본","stem":"양쪽 모두 말할 수 있지만 한쪽이 송신하는 동안 다른 쪽은 수신만 하는 무전기의 통신 방식은?","options":[{"id":"o0","text":"반이중","why":"양방향 가능 여부보다 동시 송수신 가능 여부를 확인한다. 번갈아 송수신하므로 반이중이다."},{"id":"o1","text":"데이터그램","why":"사전 연결 없는 독립적인 패킷 전달 방식이다."},{"id":"o2","text":"단방향","why":"송수신 역할이 고정되어 한쪽 방향으로만 보내는 방식이다."},{"id":"o3","text":"전이중","why":"두 장치가 동시에 송신·수신하는 방식이다."},{"id":"o4","text":"브로드캐스트","why":"영역 내 모두에게 전달한다는 수신 대상 기준이다."}],"answer":"o0","explanation":"양방향 가능 여부보다 동시 송수신 가능 여부를 확인한다. 번갈아 송수신하므로 반이중이다.","sources":[{"doc":"G3","pages":[13]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q073","chapter":3,"topics":["3-07"],"priority":"핵심","kind":"비교","level":"응용","stem":"유니캐스트와 전이중에 대한 설명으로 옳은 것은?","options":[{"id":"o0","text":"유니캐스트는 두 회선, 전이중은 ASCII의 이름이다.","why":"교안의 두 개념과 모두 다르다."},{"id":"o1","text":"유니캐스트는 수신 대상, 전이중은 동시 송수신 가능 여부를 분류한다.","why":"분류 기준이 다르므로 특정 한 수신자와 전이중으로 통신하는 상황도 표현할 수 있다."},{"id":"o2","text":"전이중이면 수신자는 반드시 모든 LAN 단말이다.","why":"전이중은 모든 단말로 전송한다는 뜻이 아니다."},{"id":"o3","text":"유니캐스트이면 반드시 단방향이어야 한다.","why":"한 수신자를 지정한다는 조건이 통신 방향을 고정하지 않는다."},{"id":"o4","text":"둘은 항상 서로 배타적인 반대말이다.","why":"수신 대상과 송수신 방향·시점이라는 서로 다른 기준이다."}],"answer":"o1","explanation":"분류 기준이 다르므로 특정 한 수신자와 전이중으로 통신하는 상황도 표현할 수 있다.","sources":[{"doc":"G3","pages":[5,11,14]},{"doc":"FULL","pages":[15]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q074","chapter":3,"topics":["3-11"],"priority":"확장","kind":"개념","level":"기본","stem":"직렬 전송에 대한 교안의 설명으로 옳은 것은?","options":[{"id":"o0","text":"n개의 비트를 항상 n개의 회선으로 동시에 전송한다.","why":"병렬 전송의 설명이다."},{"id":"o1","text":"데이터 비트를 사용하지 않는 방식이다.","why":"직렬 전송도 2진 데이터 비트를 전송한다."},{"id":"o2","text":"하나의 통신회선으로 데이터 비트를 1비트씩 순차 전송한다.","why":"직렬은 비트를 순서대로 보내며, 교안은 적은 회선 수로 원거리에서 경제적이라는 점을 설명한다."},{"id":"o3","text":"어떤 비트도 시간 순서 없이 모두 같은 순간에 도착한다.","why":"순차적인 비트 전송이라는 정의와 다르다."},{"id":"o4","text":"반드시 하나의 메시지 전체를 저장하고 전송한다.","why":"메시지 교환의 저장 단위와 직렬 전송을 혼동했다."}],"answer":"o2","explanation":"직렬은 비트를 순서대로 보내며, 교안은 적은 회선 수로 원거리에서 경제적이라는 점을 설명한다.","sources":[{"doc":"G3","pages":[15,16]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q075","chapter":3,"topics":["3-11"],"priority":"확장","kind":"비교","level":"표준","stem":"병렬 전송의 회선 수와 용도에 대한 교안의 설명으로 옳은 것은?","options":[{"id":"o0","text":"선로 수가 많아져도 거리와 비용은 무조건 0이다.","why":"교안은 거리에 비례한 선로 비용을 단점으로 제시한다."},{"id":"o1","text":"회선 하나로 1비트씩 순차 전송한다.","why":"직렬 전송의 설명이다."},{"id":"o2","text":"회선 수가 데이터 비트 수와 절대 관계없다.","why":"교안은 n비트 전송에 n개 회선을 사용하는 모델을 제시한다."},{"id":"o3","text":"n개 회선으로 n개 비트를 동시에 전송하며, 선로 비용 때문에 짧은 거리 용도로 설명한다.","why":"교안은 병렬 전송의 동시 전송과 거리 증가에 따른 회선 비용 부담을 함께 제시한다."},{"id":"o4","text":"병렬은 곧 브로드캐스트이므로 수신 대상은 모두이다.","why":"비트 전송 방법과 수신 대상 기준을 혼동했다."}],"answer":"o3","explanation":"교안은 병렬 전송의 동시 전송과 거리 증가에 따른 회선 비용 부담을 함께 제시한다.","sources":[{"doc":"G3","pages":[23]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q076","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"개념","level":"표준","stem":"송신 비트 시간 간격과 수신 비트 시간 간격의 차이를 맞춰 각 비트를 정확히 읽도록 하는 것은?","options":[{"id":"o0","text":"여러 국가의 법률을 통일하는 행위","why":"기술적 클록·비트 동기화와 무관하다."},{"id":"o1","text":"도착 확인 응답만 보내는 행위","why":"교안의 동기화는 시간·비트 경계에 관한 것이며 단순 ACK 여부와 다르다."},{"id":"o2","text":"데이터를 무조건 암호화하는 행위","why":"비트 경계 조정의 정의가 아니다."},{"id":"o3","text":"MAC 주소의 제조사 코드 설정","why":"주소 구조와 시간 동기화는 별개이다."},{"id":"o4","text":"동기화","why":"클록 차이로 비트 경계가 어긋날 수 있으므로 송신 비트를 수신 측이 정확히 구분하게 하는 과정이다."}],"answer":"o4","explanation":"클록 차이로 비트 경계가 어긋날 수 있으므로 송신 비트를 수신 측이 정확히 구분하게 하는 과정이다.","sources":[{"doc":"G3","pages":[17]},{"doc":"FULL","pages":[16]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q077","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"비교","level":"표준","stem":"동기식 전송과 비동기식 전송의 차이를 바르게 설명한 것은?","options":[{"id":"o0","text":"동기식은 블록·문자열을 연속 전송하고, 비동기식은 문자마다 시작·정지 비트로 재동기화한다.","why":"교안은 블록/연속 전송과 문자 단위 재동기화를 기준으로 구분한다."},{"id":"o1","text":"비동기식은 새로운 문자의 시작을 절대 알 수 없다.","why":"시작 비트로 문자의 시작을 알리고 재동기화한다."},{"id":"o2","text":"동기식은 도착 여부를 묻고 비동기식은 묻지 않는 것만이 차이이다.","why":"교안의 정의는 클록·비트·문자 경계에 관한 것이며 응답 여부로 구분하지 않는다."},{"id":"o3","text":"동기식에서는 모든 문자 앞뒤에 항상 시작·정지 비트를 붙인다.","why":"문자마다 시작·정지 비트를 두는 것은 비동기식의 설명이다."},{"id":"o4","text":"동기식은 빛만, 비동기식은 구리선만 사용한다.","why":"매체 종류로 두 방식을 정의하지 않는다."}],"answer":"o0","explanation":"교안은 블록/연속 전송과 문자 단위 재동기화를 기준으로 구분한다.","sources":[{"doc":"G3","pages":[18,21,22]}],"caution":"총정리 p.64가 지적한 학생 풀이와의 차이를 반영하여 강의 G3 p.17–22의 정의를 따른다.","origin":"첨부 자료 기반 재구성"},{"id":"Q078","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"개념","level":"표준","stem":"비트 지향 동기화에서 데이터에 0을 삽입하는 비트 스터핑의 목적은?","options":[{"id":"o0","text":"MAC 주소를 없애기 위해서","why":"데이터·플래그 패턴 구별이 목적이다."},{"id":"o1","text":"데이터 안의 특정 비트 패턴과 프레임 경계를 나타내는 플래그를 구별하기 위해서","why":"교안은 연속된 1 다섯 개 뒤에 0을 넣고 수신 측에서 제거하는 규칙을 제시한다."},{"id":"o2","text":"모든 프레임을 한 문자로 압축하기 위해서","why":"스터핑은 비트를 추가하는 규칙이며 제시된 압축 방식이 아니다."},{"id":"o3","text":"모든 원래 1을 영구적으로 삭제하기 위해서","why":"수신 측에서 삽입 비트를 제거하여 원래 데이터를 복원하는 것이지 원래 1을 삭제하는 것이 아니다."},{"id":"o4","text":"수신자가 데이터의 끝을 전혀 알 수 없게 하기 위해서","why":"경계 구별을 돕는 목적과 반대이다."}],"answer":"o1","explanation":"교안은 연속된 1 다섯 개 뒤에 0을 넣고 수신 측에서 제거하는 규칙을 제시한다.","sources":[{"doc":"G3","pages":[19]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q079","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"개념","level":"기본","stem":"문자 지향 동기화의 제어 문자와 의미를 바르게 연결한 것은?","options":[{"id":"o0","text":"SYN·STX·ETX는 모두 MAC 주소의 길이이다.","why":"주소 길이가 아니라 문자 지향 동기화에 사용하는 문자이다."},{"id":"o1","text":"STX는 언제나 IP 주소 해제를 뜻한다.","why":"IP 주소 해제 명령과 관계없다."},{"id":"o2","text":"SYN: 동기 / STX: 문장 시작 / ETX: 문장 끝","why":"교안의 문자 지향 방식은 동기화와 경계를 제어 문자로 표현한다."},{"id":"o3","text":"SYN: 문장 끝 / STX: 동기 / ETX: 문장 시작","why":"각 문자의 기능을 바꿨다."},{"id":"o4","text":"ETX는 케이블의 광학 재질을 뜻한다.","why":"문장 종료를 나타내는 제어 문자이다."}],"answer":"o2","explanation":"교안의 문자 지향 방식은 동기화와 경계를 제어 문자로 표현한다.","sources":[{"doc":"G3","pages":[20]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q080","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안의 비동기식 전송 설명에 부합하는 것은?","options":[{"id":"o0","text":"불규칙하게 발생하는 문자에는 사용할 수 없다.","why":"교안은 불규칙한 키보드 입력 등을 예로 든다."},{"id":"o1","text":"시작 비트는 반드시 패킷 전체의 맨 끝에만 온다.","why":"문자 시작을 알리므로 문자 앞에 놓인다."},{"id":"o2","text":"정지 비트는 문자의 데이터보다 항상 먼저 온다.","why":"정지 비트는 문자 종료를 표시한다."},{"id":"o3","text":"문자마다 시작 비트와 정지 비트를 두고, 문자 사이에 휴지 상태가 있을 수 있다.","why":"한 문자씩 보내고 새 문자의 시작에서 재동기화한다. 교안은 시작 1비트와 정지 1~2비트 등을 설명한다."},{"id":"o4","text":"긴 비트열을 문자 경계 없이만 보낸다.","why":"교안의 동기식 연속 전송 설명에 더 가깝다."}],"answer":"o3","explanation":"한 문자씩 보내고 새 문자의 시작에서 재동기화한다. 교안은 시작 1비트와 정지 1~2비트 등을 설명한다.","sources":[{"doc":"G3","pages":[21,22]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q081","chapter":3,"topics":["3-04"],"priority":"핵심","kind":"상황","level":"기본","stem":"전송 전 1011010이었던 비트열이 수신 후 1010010이 되었다. 바뀐 비트 수를 기준으로 분류하면?","options":[{"id":"o0","text":"두 개의 비연속 비트 오류","why":"다른 위치는 같으므로 두 개가 아니다."},{"id":"o1","text":"모든 비트의 반전","why":"7개 중 한 위치만 바뀌었다."},{"id":"o2","text":"오류가 전혀 없음","why":"네 번째 위치가 1에서 0으로 바뀌었다."},{"id":"o3","text":"주파수 대역폭","why":"오류 유형이 아니라 신호 주파수 범위의 크기이다."},{"id":"o4","text":"단일 비트 오류","why":"두 비트열의 네 번째 위치 하나만 달라졌다. 한 데이터 단위에서 한 비트만 바뀐 오류이다."}],"answer":"o4","explanation":"두 비트열의 네 번째 위치 하나만 달라졌다. 한 데이터 단위에서 한 비트만 바뀐 오류이다.","sources":[{"doc":"G3","pages":[25]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q082","chapter":3,"topics":["3-04","3-05","3-03"],"priority":"핵심","kind":"개념","level":"표준","stem":"패리티·BCC·CRC에서 데이터에 잉여 정보를 추가하는 공통 목적은?","options":[{"id":"o0","text":"수신 측이 전달 과정의 오류를 검사할 수 있게 하기 위해서","why":"추가된 검사 정보를 수신 측에서 이용하여 오류 여부를 판정한다. 모든 오류의 검출을 무조건 보장한다는 의미는 아니다."},{"id":"o1","text":"모든 패킷의 목적지를 무조건 바꾸기 위해서","why":"검사 비트는 수신지 변경을 위한 정보가 아니다."},{"id":"o2","text":"전송매체를 물리적으로 없애기 위해서","why":"오류 검사 정보가 매체를 대체하지 않는다."},{"id":"o3","text":"인터넷 표준화 기구를 변경하기 위해서","why":"오류 검출 절차와 무관하다."},{"id":"o4","text":"실제 데이터를 반드시 모두 없애기 위해서","why":"원래 데이터를 보존하면서 검사 정보를 덧붙인다."}],"answer":"o0","explanation":"추가된 검사 정보를 수신 측에서 이용하여 오류 여부를 판정한다. 모든 오류의 검출을 무조건 보장한다는 의미는 아니다.","sources":[{"doc":"G3","pages":[26,27,33,39]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q083","chapter":3,"topics":["3-04"],"priority":"핵심","kind":"개념","level":"기본","stem":"짝수 패리티를 적용할 때 반드시 만족하도록 만드는 조건은?","options":[{"id":"o0","text":"0의 개수가 언제나 0이다.","why":"0의 개수는 해당 패리티 조건이 아니다."},{"id":"o1","text":"패리티 비트를 포함한 전체 1의 개수가 짝수이다.","why":"데이터 부분만이 아니라 추가한 패리티 비트까지 합쳐 1의 개수를 센다."},{"id":"o2","text":"패리티를 제외한 1의 개수만 항상 홀수여야 한다.","why":"데이터의 1 개수는 입력에 따라 달라지며 전체 1의 개수를 짝수로 맞춘다."},{"id":"o3","text":"패리티 비트 자체가 반드시 0이다.","why":"데이터의 1 개수가 홀수이면 패리티는 1이어야 한다."},{"id":"o4","text":"데이터의 길이가 반드시 짝수 비트이다.","why":"전체 1의 개수에 대한 조건이지 비트열 길이에 관한 조건이 아니다."}],"answer":"o1","explanation":"데이터 부분만이 아니라 추가한 패리티 비트까지 합쳐 1의 개수를 센다.","sources":[{"doc":"G3","pages":[27,28]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q084","chapter":3,"topics":["3-04"],"priority":"핵심","kind":"개념","level":"표준","stem":"데이터에 1이 네 개 있을 때 짝수 패리티 비트와 홀수 패리티 비트는 각각?","options":[{"id":"o0","text":"0 / 0","why":"홀수 패리티의 전체 1 개수가 여전히 네 개이다."},{"id":"o1","text":"패리티에는 0이나 1을 사용할 수 없다.","why":"패리티도 추가되는 하나의 비트이다."},{"id":"o2","text":"0 / 1","why":"네 개는 이미 짝수이므로 짝수 패리티는 0, 홀수로 만들려면 한 개를 더해 홀수 패리티는 1이다."},{"id":"o3","text":"1 / 1","why":"짝수 패리티 쪽이 다섯 개가 되어 조건을 어긴다."},{"id":"o4","text":"1 / 0","why":"추가 후 1의 개수가 각각 홀수·짝수가 되어 요구 조건과 반대이다."}],"answer":"o2","explanation":"네 개는 이미 짝수이므로 짝수 패리티는 0, 홀수로 만들려면 한 개를 더해 홀수 패리티는 1이다.","sources":[{"doc":"G3","pages":[28,29]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q085","chapter":3,"topics":["3-04"],"priority":"핵심","kind":"개념","level":"표준","stem":"단일 패리티 검사의 한계를 올바르게 설명한 것은?","options":[{"id":"o0","text":"패리티를 통과하면 어떠한 오류도 절대 없다는 뜻이다.","why":"짝수 개 반전 미검출 때문에 그렇게 보장할 수 없다."},{"id":"o1","text":"한 비트 오류는 언제나 검출할 수 없다.","why":"한 비트 반전은 홀짝을 바꾸므로 단일 패리티로 검출한다."},{"id":"o2","text":"1의 개수와는 아무 관련이 없다.","why":"패리티는 전체 1의 홀짝을 검사한다."},{"id":"o3","text":"검사 대상 비트열에서 짝수 개 비트가 반전되면 오류를 검출하지 못할 수 있다.","why":"짝수 개 반전은 1 개수의 홀짝을 유지하므로 패리티 조건을 통과한다. 홀수 개 반전은 홀짝을 바꾼다."},{"id":"o4","text":"두 비트가 반전되면 무조건 오류 위치까지 복원한다.","why":"단일 패리티는 그런 위치 복원 기능을 제공하지 않는다."}],"answer":"o3","explanation":"짝수 개 반전은 1 개수의 홀짝을 유지하므로 패리티 조건을 통과한다. 홀수 개 반전은 홀짝을 바꾼다.","sources":[{"doc":"G3","pages":[31,32]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q086","chapter":3,"topics":["3-05"],"priority":"핵심","kind":"개념","level":"기본","stem":"블록 합 검사에서 BCC의 의미로 옳은 것은?","options":[{"id":"o0","text":"CRC 생성 다항식의 공식 기관명","why":"BCC는 생성 다항식을 지정하는 기구가 아니다."},{"id":"o1","text":"무선 AP의 이름","why":"무선 네트워크 이름은 SSID와 관련된다."},{"id":"o2","text":"TCP/IP의 최하위 계층","why":"프로토콜 계층 이름이 아니라 검사 문자이다."},{"id":"o3","text":"버스 케이블의 최대 길이","why":"오류 검사 문자와 전송 거리 단위는 다르다."},{"id":"o4","text":"문자 블록에 추가하는 열 패리티 검사 문자","why":"블록 합 검사는 행과 열 방향의 패리티를 적용하며, 추가된 열 패리티 문자를 BCC라고 한다."}],"answer":"o4","explanation":"블록 합 검사는 행과 열 방향의 패리티를 적용하며, 추가된 열 패리티 문자를 BCC라고 한다.","sources":[{"doc":"G3","pages":[33]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q087","chapter":3,"topics":["3-05"],"priority":"핵심","kind":"상황","level":"응용","stem":"행·열 패리티를 모두 쓰는 블록 검사에서, 서로 다른 두 행의 같은 두 열에 해당하는 네 비트가 반전되었다. 무엇을 주의해야 하는가?","options":[{"id":"o0","text":"각 행과 열에서 두 개씩 반전되어 패리티가 유지되므로 미검출될 수 있다.","why":"네 꼭짓점 형태의 오류에서는 영향을 받은 각 행·열에 짝수 개의 반전이 생긴다. 2차원 패리티에도 검출 한계가 있다."},{"id":"o1","text":"네 비트 오류이면 어떤 배열이든 반드시 위치까지 모두 알 수 있다.","why":"이 오류 배열에서는 행·열의 홀짝이 유지된다."},{"id":"o2","text":"열 검사는 행과 완전히 무관하므로 패리티는 필요 없다.","why":"행·열 정보를 함께 검사하는 것이 블록 합 검사의 핵심이다."},{"id":"o3","text":"반전된 비트는 자동으로 원래 값으로 되돌아간다.","why":"검사 통과는 실제 비트 복원과 다른 문제이다."},{"id":"o4","text":"블록 검사는 원래 한 비트 오류도 절대 검출할 수 없다.","why":"교안은 단일 비트 오류의 위치를 알 수 있는 경우를 설명한다."}],"answer":"o0","explanation":"네 꼭짓점 형태의 오류에서는 영향을 받은 각 행·열에 짝수 개의 반전이 생긴다. 2차원 패리티에도 검출 한계가 있다.","sources":[{"doc":"G3","pages":[38]},{"doc":"QUICK","pages":[3]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q088","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"개념","level":"표준","stem":"생성 비트열이 11101일 때 CRC의 FCS 길이와 송신 데이터 뒤에 붙일 0의 수는?","options":[{"id":"o0","text":"FCS 3비트 / 0을 3개 추가","why":"5비트 생성 비트열의 차수는 4이다."},{"id":"o1","text":"FCS 4비트 / 0을 4개 추가","why":"생성 비트열은 5비트이고 최고 차수는 4이다. FCS의 길이와 사전 0 추가 수는 모두 4이다."},{"id":"o2","text":"FCS 4비트 / 0을 0개 추가","why":"송신 FCS 계산에는 차수만큼의 0을 먼저 붙인다."},{"id":"o3","text":"FCS 5비트 / 0을 5개 추가","why":"비트열 길이와 다항식 차수를 혼동했다."},{"id":"o4","text":"FCS 1비트 / 0을 4개 추가","why":"패리티 비트 하나와 CRC의 다항식 차수를 혼동했다."}],"answer":"o1","explanation":"생성 비트열은 5비트이고 최고 차수는 4이다. FCS의 길이와 사전 0 추가 수는 모두 4이다.","sources":[{"doc":"G3","pages":[42]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q089","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"개념","level":"기본","stem":"CRC의 mod-2 나눗셈에서 사용하는 연산 설명으로 옳은 것은?","options":[{"id":"o0","text":"0 XOR 1은 0이다.","why":"다른 비트끼리의 XOR는 1이다."},{"id":"o1","text":"빌림이 생기면 왼쪽 데이터 비트를 반드시 2로 바꾼다.","why":"CRC의 XOR 연산에는 일반 뺄셈의 빌림이 없다."},{"id":"o2","text":"자리올림·빌림 없이 XOR하며, 같은 비트는 0이고 다른 비트는 1이다.","why":"CRC 예제의 나눗셈은 일반 정수 뺄셈이 아니라 비트별 XOR를 사용한다."},{"id":"o3","text":"1 XOR 1은 1이다.","why":"같은 비트끼리의 XOR는 0이다."},{"id":"o4","text":"항상 일반 10진수 나눗셈의 소수 나머지를 쓴다.","why":"CRC는 2진 다항식 mod-2 연산을 사용한다."}],"answer":"o2","explanation":"CRC 예제의 나눗셈은 일반 정수 뺄셈이 아니라 비트별 XOR를 사용한다.","sources":[{"doc":"G3","pages":[43]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q090","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"개념","level":"응용","stem":"CRC 수신 검사에서 수신 비트열 전체를 같은 생성 비트열로 나눈 나머지가 0이었다. 가장 신중한 해석은?","options":[{"id":"o0","text":"생성 비트열을 서로 다르게 썼다는 뜻이다.","why":"문제 조건은 송수신에서 같은 생성 비트열을 썼다는 것이다."},{"id":"o1","text":"발생 가능한 모든 비트 오류가 수학적으로 완전히 배제되었다.","why":"검사 통과와 모든 오류의 부재는 동일한 보장이 아니다."},{"id":"o2","text":"송신 데이터가 반드시 모두 0이었다.","why":"나머지가 0이라는 조건은 데이터 자체가 모두 0이라는 뜻이 아니다."},{"id":"o3","text":"그 CRC 검사를 통과했다는 뜻이며, 가능한 모든 오류가 없음을 보장하는 것은 아니다.","why":"검사는 생성 다항식에 대한 나머지를 판단한다. 총정리는 생성 다항식의 배수 형태 오류가 통과할 수 있음을 계산상의 한계로 표시한다."},{"id":"o4","text":"수신 측이 데이터를 암호화했다는 뜻이다.","why":"오류 검출과 암호화는 서로 다른 기능이다."}],"answer":"o3","explanation":"검사는 생성 다항식에 대한 나머지를 판단한다. 총정리는 생성 다항식의 배수 형태 오류가 통과할 수 있음을 계산상의 한계로 표시한다.","sources":[{"doc":"G3","pages":[40,43]},{"doc":"FULL","pages":[65]},{"doc":"QUICK","pages":[3]}],"caution":"교안의 “오류 없음”은 검사 통과 판정으로 읽는다. 이 한계는 첨부 총정리에도 명시되어 있다.","origin":"첨부 자료 기반 재구성"},{"id":"Q091","chapter":3,"topics":["3-01"],"priority":"핵심","kind":"개념","level":"표준","stem":"공유 매체 이더넷에서 CSMA/CD의 동작 순서를 바르게 요약한 것은?","options":[{"id":"o0","text":"IP 주소 갱신 → ASCII 변환 → 프린터 공유","why":"CSMA/CD의 매체 접근 절차가 아니다."},{"id":"o1","text":"토큰 획득 → 회선 영구 독점","why":"토큰 제어·회선 교환 개념을 CSMA/CD와 혼동했다."},{"id":"o2","text":"항상 전송매체가 바쁜 순간만 골라 전송","why":"반송파가 감지되면 기다리는 규칙과 반대이다."},{"id":"o3","text":"충돌 확인 없이 계속 전송 → 패킷 삭제","why":"충돌 검출과 재시도라는 핵심 절차가 없다."},{"id":"o4","text":"반송파 감지 → 비어 있으면 전송 → 충돌 확인 → 충돌 시 랜덤 대기 후 재시도","why":"듣고 전송하는 단계만이 아니라 충돌 검출과 대기·재전송까지 포함해야 한다."}],"answer":"o4","explanation":"듣고 전송하는 단계만이 아니라 충돌 검출과 대기·재전송까지 포함해야 한다.","sources":[{"doc":"G3","pages":[55,57]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q092","chapter":3,"topics":["3-01"],"priority":"핵심","kind":"상황","level":"기본","stem":"CSMA/CD에서 송신 전에 반송파가 감지되었다. 교안에 따른 판단과 행동은?","options":[{"id":"o0","text":"다른 노드가 전송 중이라고 판단하고 기다린다.","why":"반송파가 있으면 매체가 사용 중인 것으로 판단한다. 비어 있다고 판단될 때 전송을 시도한다."},{"id":"o1","text":"토큰을 새로 발행한다.","why":"CSMA/CD는 교안의 토큰 제어 방식과 다르다."},{"id":"o2","text":"반드시 모든 노드의 MAC 주소를 삭제한다.","why":"매체 사용 상태와 MAC 테이블 삭제는 무관하다."},{"id":"o3","text":"생성 다항식에 0을 추가한다.","why":"CRC 송신 계산 절차와 매체 접근 제어를 혼동했다."},{"id":"o4","text":"매체가 완전히 비었으므로 즉시 전송한다.","why":"반송파 감지의 해석을 뒤바꿨다."}],"answer":"o0","explanation":"반송파가 있으면 매체가 사용 중인 것으로 판단한다. 비어 있다고 판단될 때 전송을 시도한다.","sources":[{"doc":"G3","pages":[55,57]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q093","chapter":3,"topics":["3-01"],"priority":"핵심","kind":"상황","level":"표준","stem":"두 노드가 같은 공유 매체에서 거의 동시에 송신하여 충돌했다. 교안상 필요한 후속 처리는?","options":[{"id":"o0","text":"두 노드는 매번 반드시 똑같은 고정 시간에 재송신해야 한다.","why":"교안은 대기 시간이 랜덤이라고 설명한다."},{"id":"o1","text":"임의의 시간 동안 기다린 뒤 재전송을 시도한다.","why":"충돌이 생길 수 있기 때문에 충돌을 검사하고 랜덤 대기 후 재시도한다. 사전 감지만으로 모든 충돌이 없어지는 것은 아니다."},{"id":"o2","text":"충돌이 발생하면 반드시 메시지를 광신호로 변환해야 한다.","why":"충돌 후 처리를 매체 변환으로 정의하지 않는다."},{"id":"o3","text":"CSMA/CD이므로 충돌했다는 관찰 자체가 불가능하다.","why":"교안 p.57은 실제 충돌과 재전송 절차를 설명한다."},{"id":"o4","text":"어떤 조건에서도 영원히 재시도하지 않는다.","why":"교안은 일정 시간 대기 후 재전송을 제시한다."}],"answer":"o1","explanation":"충돌이 생길 수 있기 때문에 충돌을 검사하고 랜덤 대기 후 재시도한다. 사전 감지만으로 모든 충돌이 없어지는 것은 아니다.","sources":[{"doc":"G3","pages":[57]},{"doc":"FULL","pages":[65]}],"caution":"G4 p.30의 “충돌이 발생하지 않는다”라는 요약과 달리, 이 문항은 G3 p.57의 충돌 후 재시도 설명을 적용한다.","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q094","chapter":3,"topics":["3-10"],"priority":"핵심","kind":"비교","level":"기본","stem":"토큰 제어 방식의 장점과 제약을 함께 설명한 것은?","options":[{"id":"o0","text":"모든 노드가 토큰 없이 동시에 송신하도록 강제한다.","why":"전송 권한을 토큰으로 제어한다는 규칙과 반대이다."},{"id":"o1","text":"토큰링은 패킷 대신 전송매체를 제거한다.","why":"링을 따라 토큰과 데이터가 전달된다."},{"id":"o2","text":"토큰을 얻은 노드만 전송하여 충돌을 피하지만, 자기 차례까지 기다려야 한다.","why":"교안은 전송 권한의 순환과 기다림을 토큰 방식의 기본 특성으로 설명한다."},{"id":"o3","text":"토큰은 오류 검사용 다항식 그 자체이다.","why":"CRC 생성 다항식과 전송 권한 제어를 혼동했다."},{"id":"o4","text":"토큰을 얻어도 전송할 수 없다.","why":"토큰은 전송 기회를 부여하는 역할을 한다."}],"answer":"o2","explanation":"교안은 전송 권한의 순환과 기다림을 토큰 방식의 기본 특성으로 설명한다.","sources":[{"doc":"G3","pages":[58,59]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q095","chapter":3,"topics":["3-10"],"priority":"핵심","kind":"비교","level":"표준","stem":"토큰버스의 물리적·논리적 접속 형태를 바르게 연결한 것은?","options":[{"id":"o0","text":"논리적 연결은 전혀 존재하지 않음","why":"토큰의 전달 순서를 이루는 논리적 연결이 존재한다."},{"id":"o1","text":"물리적 링형 / 논리적 버스형","why":"교안의 두 형태를 반대로 썼다."},{"id":"o2","text":"물리적·논리적 모두 반드시 성형만","why":"교안의 버스·링 조합이 아니다."},{"id":"o3","text":"물리적 버스형 / 논리적 링형","why":"물리적 배선은 버스지만 토큰을 순환시키는 논리적 관계는 링으로 설명한다."},{"id":"o4","text":"물리적 완전 그물형 / 논리적 단절","why":"문제의 토큰버스 구조와 무관하다."}],"answer":"o3","explanation":"물리적 배선은 버스지만 토큰을 순환시키는 논리적 관계는 링으로 설명한다.","sources":[{"doc":"G3","pages":[60]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q096","chapter":3,"topics":["3-12"],"priority":"확장","kind":"비교","level":"표준","stem":"교안의 베이스밴드와 브로드밴드를 바르게 비교한 것은?","options":[{"id":"o0","text":"베이스밴드는 반드시 모든 신호를 아날로그로 변조한다.","why":"교안은 디지털 데이터 신호를 변조하지 않고 직접 전송한다고 설명한다."},{"id":"o1","text":"두 방식 모두 문자 코드를 정하는 국제기구이다.","why":"신호 전송 방식이지 기구가 아니다."},{"id":"o2","text":"브로드밴드는 한 케이블에서 여러 채널을 만들 수 없다.","why":"교안은 다수 통신 채널의 형성을 특징으로 제시한다."},{"id":"o3","text":"브로드밴드는 수신자가 모두라는 뜻의 브로드캐스트와 같은 말이다.","why":"브로드밴드는 전송 방식이고 브로드캐스트는 수신 대상 기준이다."},{"id":"o4","text":"베이스밴드는 디지털 신호를 직접 전송하고, 브로드밴드는 아날로그로 변조하여 여러 주파수 채널을 사용한다.","why":"교안의 비교 기준은 직접 디지털 전송과 아날로그 변조·다중 채널이다."}],"answer":"o4","explanation":"교안의 비교 기준은 직접 디지털 전송과 아날로그 변조·다중 채널이다.","sources":[{"doc":"G3","pages":[51,52,53]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q097","chapter":3,"topics":["3-12"],"priority":"확장","kind":"개념","level":"기본","stem":"10Base-5의 표기를 교안에 맞게 해석한 것은?","options":[{"id":"o0","text":"10Mbps / 베이스밴드 / 한 세그먼트 최장 500m","why":"10은 속도, Base는 전송 방식, 5는 이 규격에서 500m 세그먼트 길이에 대응한다."},{"id":"o1","text":"10Gbps / 브로드밴드 / 5m","why":"세 항목 모두 교안의 설명과 다르다."},{"id":"o2","text":"100Mbps / 베이스밴드 / 50m","why":"교안의 속도와 거리를 잘못 읽었다."},{"id":"o3","text":"노드 10대 / 라우터 5대 / MAC 5바이트","why":"표기는 노드·장치 개수나 MAC 길이를 뜻하지 않는다."},{"id":"o4","text":"10바이트 / 브로드캐스트 / 5비트","why":"속도·전송 방식·거리의 단위를 혼동했다."}],"answer":"o0","explanation":"10은 속도, Base는 전송 방식, 5는 이 규격에서 500m 세그먼트 길이에 대응한다.","sources":[{"doc":"G3","pages":[63]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q098","chapter":3,"topics":["3-12"],"priority":"확장","kind":"개념","level":"기본","stem":"교안의 FDDI를 구성 요소와 매체 접근 방식으로 바르게 연결한 것은?","options":[{"id":"o0","text":"전송매체 없음 / 전송 권한 없음 / 연결 없음","why":"FDDI는 실제 통신망 구성 방식이다."},{"id":"o1","text":"광섬유 / 토큰 제어 / 링형","why":"교안은 FDDI가 광섬유를 사용하며 100Mbps, 토큰 제어, 링형 구조라는 특징을 제시한다."},{"id":"o2","text":"꼬임선만 / CSMA/CD만 / 순수 버스형만","why":"제시된 FDDI의 특징과 다르다."},{"id":"o3","text":"무선 주파수만 / SSID만 / 단일 문자","why":"FDDI의 광섬유·토큰·링 설명과 맞지 않는다."},{"id":"o4","text":"문자 코드 / 패리티 / 인체 통신망","why":"매체·접근·형태에 대한 올바른 조합이 아니다."}],"answer":"o1","explanation":"교안은 FDDI가 광섬유를 사용하며 100Mbps, 토큰 제어, 링형 구조라는 특징을 제시한다.","sources":[{"doc":"G3","pages":[67]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q099","chapter":3,"topics":["3-02"],"priority":"핵심","kind":"상황","level":"표준","stem":"데이터가 잠시 없어도 설정한 통신 자원을 계속 점유한다는 비효율이 교안에서 지적된 방식은?","options":[{"id":"o0","text":"데이터그램 패킷 교환","why":"사전 논리 연결 없이 패킷별로 독립 전달하며 경로나 도착 순서가 달라질 수 있다."},{"id":"o1","text":"가상 회선 패킷 교환","why":"먼저 논리적 경로를 설정하고 VCI가 있는 패킷을 정해진 연결로 전달한다."},{"id":"o2","text":"회선 교환","why":"전송 전에 전용 경로를 설정하고 통신 동안 그 경로의 자원을 점유한다."},{"id":"o3","text":"메시지 교환","why":"메시지 전체를 저장한 뒤 다음 노드로 전달하는 축적 전송 방식이다."},{"id":"o4","text":"ATM 교환","why":"데이터 48바이트와 제어 정보 5바이트를 합친 53바이트 고정 길이 셀을 사용한다."}],"answer":"o2","explanation":"전송 전에 전용 경로를 설정하고 통신 동안 그 경로의 자원을 점유한다.","sources":[{"doc":"G3","pages":[70,71,72]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q100","chapter":3,"topics":["3-02"],"priority":"핵심","kind":"상황","level":"기본","stem":"중간 노드가 가변 길이의 메시지 전체를 저장한 후 다음 링크가 비면 전달한다. 이 방식은?","options":[{"id":"o0","text":"회선 교환","why":"전송 전에 전용 경로를 설정하고 통신 동안 그 경로의 자원을 점유한다."},{"id":"o1","text":"ATM 교환","why":"데이터 48바이트와 제어 정보 5바이트를 합친 53바이트 고정 길이 셀을 사용한다."},{"id":"o2","text":"데이터그램 패킷 교환","why":"사전 논리 연결 없이 패킷별로 독립 전달하며 경로나 도착 순서가 달라질 수 있다."},{"id":"o3","text":"메시지 교환","why":"메시지 전체를 저장한 뒤 다음 노드로 전달하는 축적 전송 방식이다."},{"id":"o4","text":"가상 회선 패킷 교환","why":"먼저 논리적 경로를 설정하고 VCI가 있는 패킷을 정해진 연결로 전달한다."}],"answer":"o3","explanation":"메시지 전체를 저장한 뒤 다음 노드로 전달하는 축적 전송 방식이다.","sources":[{"doc":"G3","pages":[73]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q101","chapter":3,"topics":["3-02"],"priority":"핵심","kind":"상황","level":"표준","stem":"한 메시지의 패킷들이 사전 연결 없이 서로 다른 경로로 진행하여 송신 순서와 다르게 도착할 수 있는 방식은?","options":[{"id":"o0","text":"메시지 교환","why":"메시지 전체를 저장한 뒤 다음 노드로 전달하는 축적 전송 방식이다."},{"id":"o1","text":"회선 교환","why":"전송 전에 전용 경로를 설정하고 통신 동안 그 경로의 자원을 점유한다."},{"id":"o2","text":"ATM 교환","why":"데이터 48바이트와 제어 정보 5바이트를 합친 53바이트 고정 길이 셀을 사용한다."},{"id":"o3","text":"가상 회선 패킷 교환","why":"먼저 논리적 경로를 설정하고 VCI가 있는 패킷을 정해진 연결로 전달한다."},{"id":"o4","text":"데이터그램 패킷 교환","why":"사전 논리 연결 없이 패킷별로 독립 전달하며 경로나 도착 순서가 달라질 수 있다."}],"answer":"o4","explanation":"사전 논리 연결 없이 패킷별로 독립 전달하며 경로나 도착 순서가 달라질 수 있다.","sources":[{"doc":"G3","pages":[76]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q102","chapter":3,"topics":["3-02"],"priority":"핵심","kind":"상황","level":"기본","stem":"먼저 논리적 연결을 만들고 패킷에 VCI를 넣어 전송하는 방식은?","options":[{"id":"o0","text":"가상 회선 패킷 교환","why":"먼저 논리적 경로를 설정하고 VCI가 있는 패킷을 정해진 연결로 전달한다."},{"id":"o1","text":"ATM 교환","why":"데이터 48바이트와 제어 정보 5바이트를 합친 53바이트 고정 길이 셀을 사용한다."},{"id":"o2","text":"메시지 교환","why":"메시지 전체를 저장한 뒤 다음 노드로 전달하는 축적 전송 방식이다."},{"id":"o3","text":"회선 교환","why":"전송 전에 전용 경로를 설정하고 통신 동안 그 경로의 자원을 점유한다."},{"id":"o4","text":"데이터그램 패킷 교환","why":"사전 논리 연결 없이 패킷별로 독립 전달하며 경로나 도착 순서가 달라질 수 있다."}],"answer":"o0","explanation":"먼저 논리적 경로를 설정하고 VCI가 있는 패킷을 정해진 연결로 전달한다.","sources":[{"doc":"G3","pages":[77]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q103","chapter":3,"topics":["3-02"],"priority":"핵심","kind":"비교","level":"응용","stem":"회선 교환과 가상 회선 패킷 교환을 구별할 때 적절한 설명은?","options":[{"id":"o0","text":"회선 교환에는 어떤 사전 설정도 없다.","why":"전송 전에 경로를 설정하는 것이 특징이다."},{"id":"o1","text":"둘 다 경로 설정을 하지만, 논리적 경로의 설정과 물리 자원의 독점은 같은 조건이 아니다.","why":"가상 회선도 연결을 먼저 설정하지만 패킷 교환으로 자원을 공유한다. 회선 교환의 전용 자원 점유와 구별한다."},{"id":"o2","text":"데이터그램만이 반드시 사전 논리 연결을 설정한다.","why":"데이터그램은 사전 논리 연결 없이 독립 전송한다."},{"id":"o3","text":"가상 회선이라는 이름이 있으면 언제나 물리 자원을 독점한다.","why":"논리 연결과 물리 자원 독점을 같은 조건으로 단정했다."},{"id":"o4","text":"가상 회선에는 식별 번호가 있을 수 없다.","why":"교안은 VCI를 명시한다."}],"answer":"o1","explanation":"가상 회선도 연결을 먼저 설정하지만 패킷 교환으로 자원을 공유한다. 회선 교환의 전용 자원 점유와 구별한다.","sources":[{"doc":"G3","pages":[70,75,77]},{"doc":"QUICK","pages":[2]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q104","chapter":3,"topics":["3-13"],"priority":"확장","kind":"개념","level":"기본","stem":"ATM 셀 하나의 크기 구성을 바르게 연결한 것은?","options":[{"id":"o0","text":"데이터 53바이트 + 제어 5바이트 = 58바이트","why":"전체 셀 길이를 데이터 길이로 잘못 사용했다."},{"id":"o1","text":"데이터 48비트 + 제어 5비트 = 53비트","why":"교안의 단위는 비트가 아니라 바이트이다."},{"id":"o2","text":"데이터 48바이트 + 제어 정보 5바이트 = 53바이트","why":"ATM은 53바이트 고정 셀을 사용한다. 데이터 부분과 전체 셀 길이를 혼동하지 않는다."},{"id":"o3","text":"데이터 5바이트 + 제어 48바이트 = 53바이트","why":"데이터와 제어 정보의 길이를 뒤바꿨다."},{"id":"o4","text":"어떤 길이든 가능한 메시지 전체 하나","why":"고정 길이 셀이라는 특징과 반대이다."}],"answer":"o2","explanation":"ATM은 53바이트 고정 셀을 사용한다. 데이터 부분과 전체 셀 길이를 혼동하지 않는다.","sources":[{"doc":"G3","pages":[78]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q105","chapter":3,"topics":["3-14"],"priority":"확장","kind":"비교","level":"표준","stem":"BSS와 ESS에 대한 교안의 설명으로 옳은 것은?","options":[{"id":"o0","text":"BSS와 ESS는 Ethernet II의 6바이트 주소 두 개이다.","why":"무선 서비스 집합과 헤더 주소 필드는 다른 개념이다."},{"id":"o1","text":"BSS는 비트율을 표시하는 단위이고 ESS는 전압 단위이다.","why":"서비스 집합과 물리량 단위를 혼동했다."},{"id":"o2","text":"ESS의 분산 시스템은 어떤 연결도 하지 않는다.","why":"분산 시스템이 AP들을 연결한다."},{"id":"o3","text":"ESS는 AP가 있는 둘 이상의 BSS를 분산 시스템으로 연결한 확장 서비스 집합이다.","why":"BSS는 무선 LAN의 기본 서비스 집합이며 ESS는 복수의 BSS를 연결한 확장 구성이다."},{"id":"o4","text":"ESS는 반드시 단말 한 대만 포함할 수 있다.","why":"교안은 둘 이상의 BSS로 구성한다고 설명한다."}],"answer":"o3","explanation":"BSS는 무선 LAN의 기본 서비스 집합이며 ESS는 복수의 BSS를 연결한 확장 구성이다.","sources":[{"doc":"G3","pages":[82]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q106","chapter":3,"topics":["3-14"],"priority":"확장","kind":"비교","level":"기본","stem":"애드혹 모드와 하부 구조 모드를 구별한 것은?","options":[{"id":"o0","text":"애드혹은 항상 모든 패킷의 중앙 AP를 필요로 한다.","why":"문제의 애드혹 설명은 단말 간 연결이다."},{"id":"o1","text":"하부 구조 모드에는 무선 단말을 둘 수 없다.","why":"무선 단말이 AP를 통해 연결되는 모드이다."},{"id":"o2","text":"애드혹은 회선 교환, 하부 구조는 CRC의 다른 이름이다.","why":"서로 다른 분류의 개념을 혼동했다."},{"id":"o3","text":"두 모드는 각각 ASCII와 EBCDIC 문자 코드이다.","why":"문자 표현 방식이 아니라 무선 LAN 구성 방식이다."},{"id":"o4","text":"애드혹은 단말 간 직접 연결, 하부 구조 모드는 AP를 중심으로 연결한다.","why":"교안은 무선 단말끼리의 연결과 AP를 이용한 중앙 연결을 구분한다."}],"answer":"o4","explanation":"교안은 무선 단말끼리의 연결과 AP를 이용한 중앙 연결을 구분한다.","sources":[{"doc":"G3","pages":[88,89,90]},{"doc":"P90","pages":[11]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q107","chapter":3,"topics":["3-09"],"priority":"핵심","kind":"개념","level":"표준","stem":"강의 3번 PDF의 매체 접근 제어 절(p.91–92)을 기준으로, 무선 LAN을 위한 충돌 회피 방식은?","options":[{"id":"o0","text":"CSMA/CA","why":"해당 절은 무선 LAN의 문제를 CSMA/CD만으로 해결하기 어려워 CSMA/CA를 도입했다고 설명한다. CA는 Collision Avoidance이다."},{"id":"o1","text":"NRZ-I","why":"디지털 비트를 전압 전이로 표현하는 부호화 방식이다."},{"id":"o2","text":"CRC","why":"CRC는 오류 검출을 위한 다항식 검사이다."},{"id":"o3","text":"BCC","why":"BCC는 블록 합 검사의 열 패리티 문자이다."},{"id":"o4","text":"CSMA/CD","why":"CD는 충돌 검출이다. 이 문항은 무선 접근 제어 절이 명시한 CA를 묻는다."}],"answer":"o0","explanation":"해당 절은 무선 LAN의 문제를 CSMA/CD만으로 해결하기 어려워 CSMA/CA를 도입했다고 설명한다. CA는 Collision Avoidance이다.","sources":[{"doc":"G3","pages":[91,92]},{"doc":"FULL","pages":[65]}],"caution":"G3 p.85의 802.11g 설명에는 CSMA/CD 표기가 있어 p.91–92와 엇갈린다. 이 문항은 적용할 절을 명시했다.","origin":"첨부 자료 기반 재구성"},{"id":"Q108","chapter":3,"topics":["3-15"],"priority":"확장","kind":"개념","level":"기본","stem":"SSID를 가장 적절히 설명한 것은?","options":[{"id":"o0","text":"헤더 뒤의 모든 데이터 길이","why":"페이로드 길이에 대한 설명이며 SSID 정의가 아니다."},{"id":"o1","text":"무선 네트워크를 식별하는 이름","why":"교안은 SSID를 연결하려는 Wi-Fi 네트워크를 구별하는 이름으로 설명한다."},{"id":"o2","text":"초당 반복되는 신호의 사이클 수","why":"주파수의 정의이다."},{"id":"o3","text":"항상 48비트인 NIC 제조사 코드 전체","why":"MAC 주소와 무선 네트워크 이름을 혼동했다."},{"id":"o4","text":"CRC의 생성 다항식 차수","why":"오류 검사와 무선 식별자는 다른 개념이다."}],"answer":"o1","explanation":"교안은 SSID를 연결하려는 Wi-Fi 네트워크를 구별하는 이름으로 설명한다.","sources":[{"doc":"G3","pages":[94]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q109","chapter":3,"topics":["3-15"],"priority":"확장","kind":"상황","level":"표준","stem":"교안에 제시된 AP 연결 과정을 순서대로 요약한 것은?","options":[{"id":"o0","text":"CRC 나머지 → FCS 추가 → 양자화","why":"오류 검사와 신호 변환 단계를 무선 연결 절차로 섞었다."},{"id":"o1","text":"MAC 삭제 → 케이블 절단 → 데이터 복호","why":"AP 연결 절차와 관련 없는 순서이다."},{"id":"o2","text":"비콘 수신 → SSID 확인 → 인증 확인 → 연결 요청·승인","why":"교안 p.95–96의 단계적 설명을 요약한 것이다. 비콘은 AP가 자신을 알리는 신호이다."},{"id":"o3","text":"모든 사용자에게 같은 IP 주소 강제 → 종료","why":"교안이 제시한 연결 절차가 아니다."},{"id":"o4","text":"연결 승인 → 비콘 생성 금지 → 인증 생략","why":"교안의 확인·인증·승인 순서와 다르다."}],"answer":"o2","explanation":"교안 p.95–96의 단계적 설명을 요약한 것이다. 비콘은 AP가 자신을 알리는 신호이다.","sources":[{"doc":"G3","pages":[95,96]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q110","chapter":3,"topics":["3-15"],"priority":"확장","kind":"상황","level":"응용","stem":"802.11b/g의 인접 AP 채널을 서로 다른 번호로 설정했다. 교안 p.98을 반영한 판단은?","options":[{"id":"o0","text":"같은 번호일 때만 전파가 존재한다.","why":"채널 번호와 전파의 존재 자체를 혼동한 설명이다."},{"id":"o1","text":"다른 번호이면 모든 주파수가 자동으로 광섬유로 바뀐다.","why":"무선 채널 설정과 광섬유 전송은 별개이다."},{"id":"o2","text":"SSID가 다르면 주파수 대역은 반드시 겹치지 않는다.","why":"네트워크 이름의 차이가 주파수 구간의 분리를 보장하지 않는다."},{"id":"o3","text":"채널 번호가 달라도 주파수 구간이 겹치면 간섭할 수 있다.","why":"교안 p.98은 b/g의 서로 다른 채널이 일부 주파수 대역을 공유할 수 있다는 예외를 명시한다."},{"id":"o4","text":"채널 번호가 다르면 어떠한 간섭도 절대로 없다.","why":"p.98의 주파수 중첩 예외를 무시했다."}],"answer":"o3","explanation":"교안 p.98은 b/g의 서로 다른 채널이 일부 주파수 대역을 공유할 수 있다는 예외를 명시한다.","sources":[{"doc":"G3","pages":[96,98]},{"doc":"FULL","pages":[65]}],"caution":"p.96의 단순화된 문장만 외우지 않고, p.98에 제시된 b/g의 예외를 함께 적용한다.","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q111","chapter":3,"topics":["3-04"],"priority":"핵심","kind":"계산","level":"기본","stem":"데이터 1010111에 짝수 패리티를 적용한다. 패리티 비트는 맨 앞에 붙인다. 전송할 8비트열은?","options":[{"id":"o0","text":"01110101","why":"패리티 값과 데이터 순서를 함께 잘못 적용했다."},{"id":"o1","text":"11110101","why":"원래 데이터 비트의 순서를 뒤집었다."},{"id":"o2","text":"10101111","why":"패리티 비트를 맨 뒤에 붙였다. 문제는 맨 앞을 지정했다."},{"id":"o3","text":"11010111","why":"데이터의 1은 5개이다. 패리티 1을 앞에 붙이면 전체 1은 6개로 짝수가 된다. 전송열은 1 1010111이다."},{"id":"o4","text":"01010111","why":"전체 1의 개수를 요구한 홀짝과 반대로 만든다."}],"answer":"o3","explanation":"데이터의 1은 5개이다. 패리티 1을 앞에 붙이면 전체 1은 6개로 짝수가 된다. 전송열은 1 1010111이다.","sources":[{"doc":"G3","pages":[27,28,29,31]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"parity","data":"1010111","odd":false}},{"id":"Q112","chapter":3,"topics":["3-04"],"priority":"핵심","kind":"계산","level":"기본","stem":"데이터 1101001에 홀수 패리티를 적용한다. 패리티 비트는 맨 앞에 붙인다. 전송할 8비트열은?","options":[{"id":"o0","text":"01001011","why":"패리티 값과 데이터 순서를 함께 잘못 적용했다."},{"id":"o1","text":"11010011","why":"패리티 비트를 맨 뒤에 붙였다. 문제는 맨 앞을 지정했다."},{"id":"o2","text":"01101001","why":"전체 1의 개수를 요구한 홀짝과 반대로 만든다."},{"id":"o3","text":"11001011","why":"원래 데이터 비트의 순서를 뒤집었다."},{"id":"o4","text":"11101001","why":"데이터의 1은 4개이다. 패리티 1을 앞에 붙이면 전체 1은 5개로 홀수가 된다. 전송열은 1 1101001이다."}],"answer":"o4","explanation":"데이터의 1은 4개이다. 패리티 1을 앞에 붙이면 전체 1은 5개로 홀수가 된다. 전송열은 1 1101001이다.","sources":[{"doc":"G3","pages":[27,28,29,31]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"parity","data":"1101001","odd":true}},{"id":"Q113","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"계산","level":"응용","stem":"데이터 01111110에 “연속된 1 다섯 개 뒤에 0 삽입”을 적용한다. 경계 플래그는 별도로 붙이지 않는다. 스터핑 후 비트열은?","options":[{"id":"o0","text":"011111010","why":"원래 0 | 11111 | 1 | 0에서 다섯 번째 1 다음에 0을 넣는다. 결과는 0 | 11111 | 0 | 1 | 0 = 011111010이다."},{"id":"o1","text":"01111110","why":"삽입할 0을 누락했다."},{"id":"o2","text":"001111110","why":"연속 1을 세지 않고 앞에만 0을 추가했다."},{"id":"o3","text":"011111100","why":"연속 1 여섯 개 뒤에 삽입하여 문제의 다섯 개 규칙을 지키지 않았다."},{"id":"o4","text":"011110110","why":"다섯 개가 되기 전에 0을 삽입했다."}],"answer":"o0","explanation":"원래 0 | 11111 | 1 | 0에서 다섯 번째 1 다음에 0을 넣는다. 결과는 0 | 11111 | 0 | 1 | 0 = 011111010이다.","sources":[{"doc":"G3","pages":[19]},{"doc":"FULL","pages":[16]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"stuff","data":"01111110"}},{"id":"Q114","chapter":3,"topics":["3-05"],"priority":"핵심","kind":"계산","level":"응용","stem":"세 데이터 행이 1011, 1100, 0010이다. 각 열에 짝수 패리티가 되도록 맨 아래 추가할 4비트 BCC는? (행 패리티의 추가 계산은 하지 않는다.)","options":[{"id":"o0","text":"0010","why":"마지막 행을 그대로 복사했을 뿐 모든 열을 검사하지 않았다."},{"id":"o1","text":"0101","why":"열별 1의 개수는 2, 1, 2, 1이다. 짝수가 되도록 0, 1, 0, 1을 더하므로 BCC는 0101이다. 세 행의 비트별 XOR로도 계산할 수 있다."},{"id":"o2","text":"0000","why":"1의 개수가 홀수인 두 열에 필요한 1을 누락했다."},{"id":"o3","text":"1010","why":"열별 짝수 패리티의 보수를 써서 전체를 홀수로 만든다."},{"id":"o4","text":"1111","why":"이미 짝수인 첫째·셋째 열에 불필요하게 1을 넣었다."}],"answer":"o1","explanation":"열별 1의 개수는 2, 1, 2, 1이다. 짝수가 되도록 0, 1, 0, 1을 더하므로 BCC는 0101이다. 세 행의 비트별 XOR로도 계산할 수 있다.","sources":[{"doc":"G3","pages":[33,37,38]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"bcc","rows":["1011","1100","0010"]}},{"id":"Q115","chapter":3,"topics":["3-08"],"priority":"핵심","kind":"계산","level":"응용","stem":"비동기 전송에서 문자 데이터 8비트, 시작 1비트, 패리티 1비트, 정지 1비트를 보낸다. 문자 사이 추가 휴지가 없다면 유효 데이터 비율은 약 얼마인가?","options":[{"id":"o0","text":"100%","why":"시작·패리티·정지 비트 오버헤드를 무시했다."},{"id":"o1","text":"87.5%","why":"유효 데이터 8비트를 전체 11비트가 아닌 다른 분모로 나눈 값이다."},{"id":"o2","text":"72.7%","why":"문자당 총 비트 수는 8+1+1+1=11이다. 유효 데이터 비율은 8/11×100≈72.7%이다."},{"id":"o3","text":"80%","why":"패리티 비트 1개를 빠뜨려 8/10으로 계산했다."},{"id":"o4","text":"27.3%","why":"3/11에 해당하는 오버헤드 비율이다."}],"answer":"o2","explanation":"문자당 총 비트 수는 8+1+1+1=11이다. 유효 데이터 비율은 8/11×100≈72.7%이다.","sources":[{"doc":"G3","pages":[21,22]},{"doc":"FULL","pages":[16]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"efficiency","data":8,"overhead":3,"rounded":1}},{"id":"Q116","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"계산","level":"응용","stem":"CRC에서 데이터 D=10101101, 생성 비트열 G=11101이다. D 뒤에 0을 4개 붙여 mod-2 나눗셈할 때 4비트 FCS는?","options":[{"id":"o0","text":"0001","why":"G의 차수 4만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 1011가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o1","text":"0010","why":"G의 차수 4만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 1011가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o2","text":"0100","why":"G의 차수 4만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 1011가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o3","text":"1011","why":"① G의 길이 5 → 차수 4.\n② D에 0을 4개 추가: 101011010000.\n③ XOR 나눗셈:\n101011010000 XOR 111010000000 = 010001010000\n010001010000 XOR 011101000000 = 001100010000\n001100010000 XOR 001110100000 = 000010110000\n000010110000 XOR 000011101000 = 000001011000\n000001011000 XOR 000001110100 = 000000101100\n000000101100 XOR 000000111010 = 000000010110\n000000010110 XOR 000000011101 = 000000001011\n④ 마지막 4비트 1011가 FCS이다.\n⑤ 전송열은 101011011011이고 같은 G로 나눈 나머지는 0000."},{"id":"o4","text":"1100","why":"G의 차수 4만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 1011가 남는다. 아래 단계별 계산을 확인한다."}],"answer":"o3","explanation":"① G의 길이 5 → 차수 4.\n② D에 0을 4개 추가: 101011010000.\n③ XOR 나눗셈:\n101011010000 XOR 111010000000 = 010001010000\n010001010000 XOR 011101000000 = 001100010000\n001100010000 XOR 001110100000 = 000010110000\n000010110000 XOR 000011101000 = 000001011000\n000001011000 XOR 000001110100 = 000000101100\n000000101100 XOR 000000111010 = 000000010110\n000000010110 XOR 000000011101 = 000000001011\n④ 마지막 4비트 1011가 FCS이다.\n⑤ 전송열은 101011011011이고 같은 G로 나눈 나머지는 0000.","sources":[{"doc":"G3","pages":[39,40,42,43,44]},{"doc":"QUICK","pages":[3]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"crc","data":"10101101","g":"11101","task":"fcs","received":null}},{"id":"Q117","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"계산","level":"응용","stem":"CRC에서 데이터 D=10101101, 생성 비트열 G=1101이다. D 뒤에 0을 3개 붙여 mod-2 나눗셈할 때 3비트 FCS는?","options":[{"id":"o0","text":"110","why":"G의 차수 3만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 111가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o1","text":"000","why":"G의 차수 3만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 111가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o2","text":"100","why":"G의 차수 3만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 111가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o3","text":"001","why":"G의 차수 3만큼 0을 추가한 데이터에 XOR 나눗셈을 적용하면 이 나머지가 아니라 111가 남는다. 아래 단계별 계산을 확인한다."},{"id":"o4","text":"111","why":"① G의 길이 4 → 차수 3.\n② D에 0을 3개 추가: 10101101000.\n③ XOR 나눗셈:\n10101101000 XOR 11010000000 = 01111101000\n01111101000 XOR 01101000000 = 00010101000\n00010101000 XOR 00011010000 = 00001111000\n00001111000 XOR 00001101000 = 00000010000\n00000010000 XOR 00000011010 = 00000001010\n00000001010 XOR 00000001101 = 00000000111\n④ 마지막 3비트 111가 FCS이다.\n⑤ 전송열은 10101101111이고 같은 G로 나눈 나머지는 000."}],"answer":"o4","explanation":"① G의 길이 4 → 차수 3.\n② D에 0을 3개 추가: 10101101000.\n③ XOR 나눗셈:\n10101101000 XOR 11010000000 = 01111101000\n01111101000 XOR 01101000000 = 00010101000\n00010101000 XOR 00011010000 = 00001111000\n00001111000 XOR 00001101000 = 00000010000\n00000010000 XOR 00000011010 = 00000001010\n00000001010 XOR 00000001101 = 00000000111\n④ 마지막 3비트 111가 FCS이다.\n⑤ 전송열은 10101101111이고 같은 G로 나눈 나머지는 000.","sources":[{"doc":"G3","pages":[39,40,42,43,44]},{"doc":"QUICK","pages":[3]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"crc","data":"10101101","g":"1101","task":"fcs","received":null}},{"id":"Q118","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"계산","level":"응용","stem":"CRC에서 D=1101, G=1011이다. CRC를 붙여 실제로 전송할 전체 비트열은?","options":[{"id":"o0","text":"1101001","why":"G의 차수는 3이다. 1101000를 G로 XOR 나눗셈하면 FCS=001. 원래 D와 FCS를 이어 1101001를 보낸다. 수신 검산 나머지=000.\n1101000 XOR 1011000 = 0110000\n0110000 XOR 0101100 = 0011100\n0011100 XOR 0010110 = 0001010\n0001010 XOR 0001011 = 0000001"},{"id":"o1","text":"11011011","why":"생성 비트열 G 자체를 FCS 대신 붙였다."},{"id":"o2","text":"1101000","why":"계산용으로 붙인 0을 실제 FCS로 착각했다."},{"id":"o3","text":"1101","why":"FCS를 붙이지 않았다."},{"id":"o4","text":"0011101","why":"FCS는 원래 데이터 뒤에 붙여야 하는데 앞에 붙였다."}],"answer":"o0","explanation":"G의 차수는 3이다. 1101000를 G로 XOR 나눗셈하면 FCS=001. 원래 D와 FCS를 이어 1101001를 보낸다. 수신 검산 나머지=000.\n1101000 XOR 1011000 = 0110000\n0110000 XOR 0101100 = 0011100\n0011100 XOR 0010110 = 0001010\n0001010 XOR 0001011 = 0000001","sources":[{"doc":"G3","pages":[39,40,42,43,44]},{"doc":"QUICK","pages":[3]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"crc","data":"1101","g":"1011","task":"tx","received":null}},{"id":"Q119","chapter":3,"topics":["3-03"],"priority":"핵심","kind":"계산","level":"응용","stem":"수신 비트열 R=1101101, 생성 비트열 G=1011이다. R 자체를 G로 mod-2 나눗셈한 3비트 나머지는? (수신 검사에서는 0을 다시 붙이지 않는다.)","options":[{"id":"o0","text":"010","why":"수신열 전체를 그대로 XOR 나눗셈하면 나머지는 100이다. 송신용 0 추가 절차를 반복하거나 일반 뺄셈을 쓰지 않는다."},{"id":"o1","text":"100","why":"수신 측은 받은 전체 비트열을 그대로 나눈다.\n1101101 XOR 1011000 = 0110101\n0110101 XOR 0101100 = 0011001\n0011001 XOR 0010110 = 0001111\n0001111 XOR 0001011 = 0000100\n나머지는 100이다. 0이 아니므로 이 검사에서 오류가 검출된다."},{"id":"o2","text":"001","why":"수신열 전체를 그대로 XOR 나눗셈하면 나머
