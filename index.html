선순위 연결"},"FULL":{"name":"Computer_Networking_Midterm_Complete.pdf","pages":72,"role":"풀이 확장·자료 차이 대조"},"QUICK":{"name":"Computer_Networking_Midterm_Quick_Review.pdf","pages":6,"role":"공식·파형 규칙 교차 확인"}},"notices":[{"title":"학습 범위와 실제 시험 조건","text":"5개 강의 PDF 368쪽의 주요 개념과 첨부 정리 3종을 바탕으로 만들었습니다. 학습 단원은 개요·구성·통신·모델·신호·부호화의 6개입니다. 5번 PDF p.20부터 부호화가 이어집니다. 240문항은 새로 구성한 연습 문제이며 실제 시험 문제·공식 정답·만점을 보장하지 않습니다. 교수자의 범위·제외 단원·정오표·시험 공지가 우선입니다.","sources":[{"doc":"P90","pages":[1,2,23]},{"doc":"FULL","pages":[3]}]},{"title":"90개 예상 주제와의 연결","text":"예상문제 PDF의 1-01~6-15를 주제별로 연결했습니다. 01~10은 해당 자료의 핵심, 11~15는 추가 주제로 분류됩니다. 모든 90개 주제에 관련 문항이 있지만 서술형 요구의 모든 세부 문장을 객관식 한 문제씩 대체했다는 의미는 아닙니다. 핵심·확장은 학습 우선순위이며 실제 출제 확률이 아닙니다.","sources":[{"doc":"P90","pages":[2,23]}]},{"title":"CSMA/CA와 채널 간섭","text":"강의 3 p.85의 CSMA/CD 표기와 p.91–92의 무선 CSMA/CA 설명이 엇갈립니다. 해당 문항은 적용할 절을 명시했습니다. 또한 p.96의 다른 채널 설명만으로 간섭 없음이라고 단정하지 않고 p.98의 802.11b/g 중첩 예외를 함께 적용합니다.","sources":[{"doc":"G3","pages":[85,91,92,96,98]},{"doc":"FULL","pages":[65]}]},{"title":"CRC의 0 나머지는 검사 통과","text":"FCS 길이는 G의 차수(비트열 길이−1)입니다. 송신에서는 0을 추가해 계산하고, 수신에서는 받은 비트열 자체를 나눕니다. 나머지가 0이라는 사실은 그 검사를 통과했다는 뜻이며 모든 가능한 오류의 부재를 보장하지 않습니다. 계산 문항의 입력값·단위·선행 0을 보존했습니다.","sources":[{"doc":"G3","pages":[42,43]},{"doc":"QUICK","pages":[3]},{"doc":"FULL","pages":[65]}]},{"title":"부호화의 극성과 초기 조건","text":"NRZ-L은 0=+V, 1=−V이고 RZ는 0=−V→0V, 1=+V→0V입니다. Manchester는 0=+V→−V, 1=−V→+V입니다. 차동 Manchester의 이전 “패턴”은 두 반구간 모양입니다. 첫 비트 직전 전압이나 직전 패턴이 달라지면 그림의 극성도 달라질 수 있으므로 문제 조건을 읽으세요.","sources":[{"doc":"G5","pages":[24,25,26,27,28,29]},{"doc":"P90","pages":[21,22]},{"doc":"QUICK","pages":[4]}]},{"title":"애매한 수치를 정답 하나로 강제하지 않음","text":"총정리 p.65는 10BASE-2 길이의 200m/185m 자료 차이, 케이블 모뎀의 단방향 문장, DSL 표현, UTP/FTP/STP 단순화 등을 표시합니다. 상충하는 제한 길이나 현행 보급 현황은 정답 단정형 문항에서 제외했습니다. 차폐·전파 분류 등은 해당 교안 기준임을 표시했습니다.","sources":[{"doc":"G3","pages":[63]},{"doc":"G5","pages":[51,52]},{"doc":"FULL","pages":[65]}]},{"title":"이번 자료만으로 확정하지 않은 세부 범위","text":"GBN/SR 상세 윈도·ACK 규칙, IPv4 상세 헤더·클래스 계산, TCP 혼잡 알고리즘, 이진지수 백오프 산식, 메일 프로토콜 세부 등은 강의에서 확인되지 않은 빈자리를 일반 지식으로 채우지 않았습니다. 추가 수업자료나 공식 범위가 있으면 별도 대비가 필요합니다.","sources":[{"doc":"FULL","pages":[63]},{"doc":"P90","pages":[23]}]},{"title":"점수와 반복 학습 지표의 의미","text":"점수는 이 문제집에서의 정답률입니다. 최초 정답률은 각 문항을 처음 채점했을 때의 결과를 사용합니다. “2연속 정답”은 별도 재시도에서 정답을 두 번 연속 고른 내부 학습 지표이며 이해도나 실제 시험 점수를 보장하지 않습니다. 오답 복습은 두 번 연속 정답을 맞히기 전까지 남습니다. 문제를 다시 읽거나 해설을 펼치는 것만으로 정답 기록이 늘어나지 않습니다.","sources":[]}],"formulas":[{"title":"주기·주파수","formula":"T = 1/f    ·    f = 1/T","text":"T는 초(s), f는 Hz. 1ms=10⁻³s, 1μs=10⁻⁶s.","sources":[{"doc":"G5","pages":[9]}]},{"title":"비트간격·비트율","formula":"Tb = 1/Rb","text":"Rb는 bps. kbps=1,000bps, Mbps=1,000,000bps.","sources":[{"doc":"G5","pages":[16]},{"doc":"QUICK","pages":[5]}]},{"title":"주파수 대역폭","formula":"W = f높음 − f낮음","text":"단위 Hz. 신호의 높이인 진폭, 초당 비트 수인 bps와 구별.","sources":[{"doc":"G5","pages":[11]}]},{"title":"샤논 채널용량","formula":"C = W × log₂(1 + S/N)","text":"W는 Hz, S/N은 선형 전력비, C는 bps. dB를 그대로 대입하지 않기.","sources":[{"doc":"G5","pages":[19]}]},{"title":"전력비와 데시벨","formula":"dB = 10 log₁₀(P₁/P₂)\nP₁/P₂ = 10^(dB/10)","text":"전력비 100은 20dB, 30dB는 전력비 1,000. 분자·분모 확인.","sources":[{"doc":"G5","pages":[19]},{"doc":"QUICK","pages":[5]}]},{"title":"심볼과 비트","formula":"n = log₂M    ·    Rb = Rs × n","text":"M=2ⁿ개의 구별 가능한 상태, Rs는 baud. 추가 부호화 오버헤드가 없는 조건.","sources":[{"doc":"FULL","pages":[47]},{"doc":"QUICK","pages":[5]}]},{"title":"PCM","formula":"fs ≥ 2f최고\nRb = fs × 표본당 비트 × 채널 수","text":"Ts≤1/(2f최고). 표본화→양자화→부호화. 비트율은 오버헤드 제외 조건.","sources":[{"doc":"G5","pages":[55,56,57,58]},{"doc":"FULL","pages":[49]}]},{"title":"완전 그물형","formula":"링크 = n(n−1)/2\n노드당 포트 = n−1","text":"모든 서로 다른 노드 쌍이 링크 하나로 직접 연결된 조건. 포트 총수=n(n−1).","sources":[{"doc":"G2","pages":[46]},{"doc":"FULL","pages":[12]}]},{"title":"CRC","formula":"r = G 길이 − 1\n송신: D 뒤에 0 r개 → XOR 나머지 → D + FCS","text":"수신: 받은 전체 비트열을 G로 나눈다. FCS의 선행 0도 보존.","sources":[{"doc":"G3","pages":[42,43]},{"doc":"QUICK","pages":[3]}]},{"title":"핵심 길이","formula":"1byte = 8bit\nMAC = 6byte · Ethernet II 헤더 = 14byte\nATM 셀 = 48 + 5 = 53byte","text":"Ethernet II는 교안의 기본 헤더. 데이터·헤더·전체 길이를 구분.","sources":[{"doc":"G1","pages":[34]},{"doc":"G4","pages":[24]},{"doc":"G3","pages":[78]}]}],"rules":{"NRZ-L":"교안 규칙: 0=+V, 1=−V. 각 비트 구간에서 그 레벨을 유지한다.","NRZ-I":"1이면 비트 시작 경계에서 직전 전압을 반전하고, 0이면 유지한다.","RZ":"0은 −V→0V, 1은 +V→0V. 뒤 절반은 항상 0V이다.","Manchester":"교안 규칙: 0은 +V→−V, 1은 −V→+V. 매 비트 중간에 전이가 있다.","차동 Manchester":"매 비트 중간에서 반전한다. 0은 시작 경계에서 반전하고, 1은 시작 경계에서 유지한다. 이는 교안의 0=이전 두 반구간 패턴 유지, 1=패턴 반전과 같다.","AMI":"0은 0V, 1의 펄스는 +V와 −V를 교대로 쓴다. 첫 1의 극성은 문제 조건을 따른다."},"questions":[{"id":"Q001","chapter":1,"topics":["1-02"],"priority":"핵심","kind":"개념","level":"기본","stem":"다음 중 교안이 제시한 데이터통신의 다섯 가지 필수 요소에 포함되지 않는 것은?","options":[{"id":"o0","text":"운영체제","why":"교안의 필수 요소는 메시지, 전송장치, 수신장치, 전송매체, 프로토콜이다. 운영체제는 이 다섯 항목에 포함되지 않는다."},{"id":"o1","text":"프로토콜","why":"데이터통신에 적용하는 규칙이므로 필수 요소이다."},{"id":"o2","text":"전송장치","why":"메시지를 보내는 장치이므로 필수 요소이다."},{"id":"o3","text":"메시지","why":"메시지는 주고받을 정보이므로 필수 요소에 포함된다."},{"id":"o4","text":"전송매체","why":"메시지가 이동하는 실제 전송로이므로 필수 요소이다."}],"answer":"o0","explanation":"교안의 필수 요소는 메시지, 전송장치, 수신장치, 전송매체, 프로토콜이다. 운영체제는 이 다섯 항목에 포함되지 않는다.","sources":[{"doc":"G1","pages":[4,6]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q002","chapter":1,"topics":["1-02"],"priority":"핵심","kind":"상황","level":"표준","stem":"송수신 장치와 케이블이 준비되어 있어도, 데이터 형식과 교환 규칙에 대한 약속이 없다면 부족한 필수 요소는?","options":[{"id":"o0","text":"메시지","why":"메시지는 교환하려는 정보 자체이다. 정보를 교환하는 규칙은 프로토콜이다."},{"id":"o1","text":"프로토콜","why":"정보를 어떻게 주고받을지 정한 공통 규칙이다. 장치와 전송로만으로는 규칙에 대한 합의가 대체되지 않는다."},{"id":"o2","text":"수신장치","why":"수신장치는 메시지를 받는 장치이다. 규칙 그 자체가 아니다."},{"id":"o3","text":"전송장치","why":"전송장치는 메시지를 보내는 장치이다. 규칙에 대한 약속과 구별한다."},{"id":"o4","text":"전송매체","why":"전송매체는 케이블·무선 링크 등 전송로이다. 문제에서 이미 준비되었다."}],"answer":"o1","explanation":"정보를 어떻게 주고받을지 정한 공통 규칙이다. 장치와 전송로만으로는 규칙에 대한 합의가 대체되지 않는다.","sources":[{"doc":"G1","pages":[4,6]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q003","chapter":1,"topics":["1-01"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안에서 일반적인 데이터 전송 단위로 설명한 패킷의 의미로 가장 적절한 것은?","options":[{"id":"o0","text":"오직 전송매체의 물리적 길이","why":"물리적 길이는 매체의 속성이지 데이터 조각의 정의가 아니다."},{"id":"o1","text":"네트워크 카드의 제조사 번호","why":"제조사 번호는 MAC 주소 구조에 관한 설명이다."},{"id":"o2","text":"큰 데이터를 나누어 네트워크로 보내는 작은 데이터 조각","why":"교안의 일반적인 패킷 설명은 큰 데이터를 작게 나눈 전송 단위이다. OSI 3계층 PDU의 명칭이라는 좁은 의미와 문맥을 구분한다."},{"id":"o3","text":"주기적으로 반복되는 전압의 높이","why":"전압의 높이는 신호의 진폭에 관한 개념이다."},{"id":"o4","text":"송수신 양쪽의 공통 운영체제","why":"패킷은 운영체제가 아니라 전송되는 데이터 단위이다."}],"answer":"o2","explanation":"교안의 일반적인 패킷 설명은 큰 데이터를 작게 나눈 전송 단위이다. OSI 3계층 PDU의 명칭이라는 좁은 의미와 문맥을 구분한다.","sources":[{"doc":"G1","pages":[30]},{"doc":"FULL","pages":[5]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q004","chapter":1,"topics":["1-01"],"priority":"핵심","kind":"개념","level":"기본","stem":"패킷의 헤더와 페이로드를 바르게 연결한 것은?","options":[{"id":"o0","text":"헤더: 전송매체 / 페이로드: 수신장치","why":"둘 다 패킷 내부 필드의 정의가 아니라 통신 구성 요소이다."},{"id":"o1","text":"헤더: 실제 데이터만 / 페이로드: 송수신지 주소만","why":"제어 정보와 실제 데이터의 역할을 뒤바꿨다."},{"id":"o2","text":"헤더: 잡음만 / 페이로드: 전원 전압만","why":"잡음과 전원 전압은 헤더·페이로드의 내용 구분이 아니다."},{"id":"o3","text":"헤더: 송수신지·일련번호 등 / 페이로드: 실제 전송 데이터","why":"헤더는 전달과 재조립 등에 필요한 제어 정보를, 페이로드는 실제 전달할 데이터를 담는다."},{"id":"o4","text":"헤더와 페이로드 모두 일련번호만","why":"실제 데이터를 담는 페이로드가 빠졌으며, 헤더도 일련번호만 담는 것은 아니다."}],"answer":"o3","explanation":"헤더는 전달과 재조립 등에 필요한 제어 정보를, 페이로드는 실제 전달할 데이터를 담는다.","sources":[{"doc":"G1","pages":[32]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q005","chapter":1,"topics":["1-01"],"priority":"핵심","kind":"상황","level":"표준","stem":"번호가 붙은 패킷이 3→1→2 순서로 도착했다. 교안의 재조립 설명에 맞는 처리는?","options":[{"id":"o0","text":"가장 먼저 도착한 패킷만 남긴다.","why":"이 처리는 나머지 실제 데이터를 잃게 하므로 재조립이 아니다."},{"id":"o1","text":"도착 순서가 항상 원래 순서이므로 3→1→2로 저장한다.","why":"교안은 패킷이 순서대로 도착하지 않을 수 있다고 설명한다."},{"id":"o2","text":"각 패킷에 같은 번호를 다시 붙인다.","why":"동일 번호를 붙이면 원래 순서를 식별할 정보를 없앤다."},{"id":"o3","text":"도착 순서가 바뀌면 원래 순서를 알아낼 방법이 전혀 없다.","why":"문제에 주어진 번호가 원래 순서를 복원할 근거이다."},{"id":"o4","text":"패킷 번호를 이용해 1→2→3 순서로 재조립한다.","why":"전송 순서와 도착 순서는 달라질 수 있다. 수신 측은 송신 측이 부여한 번호를 이용하여 원래 순서로 재조립한다."}],"answer":"o4","explanation":"전송 순서와 도착 순서는 달라질 수 있다. 수신 측은 송신 측이 부여한 번호를 이용하여 원래 순서로 재조립한다.","sources":[{"doc":"G1","pages":[31,32,33]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q006","chapter":1,"topics":["1-03"],"priority":"핵심","kind":"상황","level":"기본","stem":"여러 PC가 하나의 프린터를 함께 사용하는 사례가 직접 보여 주는 네트워크의 이점은?","options":[{"id":"o0","text":"주변장치 공유","why":"하나의 프린터를 여러 PC가 사용하는 것은 주변장치를 공동 이용하는 사례이다."},{"id":"o1","text":"모든 PC의 운영체제를 같게 만드는 것","why":"프린터 공유가 운영체제의 동일성을 뜻하지 않는다."},{"id":"o2","text":"통신 규칙을 없애는 것","why":"네트워크로 자원을 공유할 때도 프로토콜이 필요하다."},{"id":"o3","text":"전송매체를 전혀 사용하지 않는 것","why":"유선 또는 무선 매체를 통해 공유 장치에 접근한다."},{"id":"o4","text":"모든 데이터의 자동 암호화","why":"장치 공유만으로 모든 데이터의 암호화가 성립하지 않는다."}],"answer":"o0","explanation":"하나의 프린터를 여러 PC가 사용하는 것은 주변장치를 공동 이용하는 사례이다.","sources":[{"doc":"G1","pages":[27,28,29]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q007","chapter":1,"topics":["1-04"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안의 Windows 실습에서 IP 주소와 기본 게이트웨이를 확인하는 기본 명령어는?","options":[{"id":"o0","text":"ipconfig /renew","why":"DHCP 주소 임대의 갱신을 요청한다."},{"id":"o1","text":"ipconfig","why":"IP 주소·서브넷 마스크·기본 게이트웨이 등 네트워크 설정을 확인한다."},{"id":"o2","text":"ping","why":"응답 여부와 왕복시간 등을 이용해 연결 상태를 점검한다."},{"id":"o3","text":"ipconfig /release","why":"DHCP로 할당받은 IP 주소를 해제한다."},{"id":"o4","text":"ipconfig /all","why":"MAC 주소를 포함한 상세 네트워크 설정을 확인한다."}],"answer":"o1","explanation":"IP 주소·서브넷 마스크·기본 게이트웨이 등 네트워크 설정을 확인한다.","sources":[{"doc":"G1","pages":[81]},{"doc":"FULL","pages":[8]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q008","chapter":1,"topics":["1-04"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안의 Windows 실습에서 물리적 주소(MAC)를 포함한 상세 설정을 확인하는 명령어는?","options":[{"id":"o0","text":"ipconfig","why":"IP 주소·서브넷 마스크·기본 게이트웨이 등 네트워크 설정을 확인한다."},{"id":"o1","text":"ping","why":"응답 여부와 왕복시간 등을 이용해 연결 상태를 점검한다."},{"id":"o2","text":"ipconfig /all","why":"MAC 주소를 포함한 상세 네트워크 설정을 확인한다."},{"id":"o3","text":"ipconfig /release","why":"DHCP로 할당받은 IP 주소를 해제한다."},{"id":"o4","text":"ipconfig /renew","why":"DHCP 주소 임대의 갱신을 요청한다."}],"answer":"o2","explanation":"MAC 주소를 포함한 상세 네트워크 설정을 확인한다.","sources":[{"doc":"G1","pages":[82]},{"doc":"G2","pages":[16]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q009","chapter":1,"topics":["1-04"],"priority":"핵심","kind":"상황","level":"표준","stem":"DHCP 주소를 먼저 해제한 뒤 갱신하려고 한다. 명령 순서가 올바른 것은?","options":[{"id":"o0","text":"ping → hostname","why":"연결 진단과 컴퓨터 이름 확인이며 주소 해제·갱신이 아니다."},{"id":"o1","text":"hostname → tracert","why":"컴퓨터 이름과 경로 확인으로, DHCP 임대 처리 순서가 아니다."},{"id":"o2","text":"ipconfig /all → net user","why":"상세 설정과 사용자 계정을 조회할 뿐 주소를 해제·갱신하지 않는다."},{"id":"o3","text":"ipconfig /release → ipconfig /renew","why":"/release는 할당 주소 해제, /renew는 DHCP 주소 갱신 요청이다. 순서와 기능을 함께 기억한다."},{"id":"o4","text":"ipconfig /renew → ipconfig /release","why":"갱신 후 해제하는 역순이다."}],"answer":"o3","explanation":"/release는 할당 주소 해제, /renew는 DHCP 주소 갱신 요청이다. 순서와 기능을 함께 기억한다.","sources":[{"doc":"G1","pages":[83,84]},{"doc":"FULL","pages":[8]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q010","chapter":1,"topics":["1-04"],"priority":"핵심","kind":"개념","level":"기본","stem":"대상에 응답이 있는지와 왕복시간을 확인하여 연결 상태를 점검하는 명령어는?","options":[{"id":"o0","text":"ipconfig /release","why":"DHCP로 할당받은 IP 주소를 해제한다."},{"id":"o1","text":"ipconfig","why":"IP 주소·서브넷 마스크·기본 게이트웨이 등 네트워크 설정을 확인한다."},{"id":"o2","text":"ipconfig /renew","why":"DHCP 주소 임대의 갱신을 요청한다."},{"id":"o3","text":"ipconfig /all","why":"MAC 주소를 포함한 상세 네트워크 설정을 확인한다."},{"id":"o4","text":"ping","why":"응답 여부와 왕복시간 등을 이용해 연결 상태를 점검한다."}],"answer":"o4","explanation":"응답 여부와 왕복시간 등을 이용해 연결 상태를 점검한다.","sources":[{"doc":"G1","pages":[85]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q011","chapter":1,"topics":["1-04"],"priority":"핵심","kind":"개념","level":"기본","stem":"컴퓨터 이름 확인과 사용자 계정 확인의 명령어를 순서대로 바르게 연결한 것은?","options":[{"id":"o0","text":"hostname / net user","why":"교안의 명령어 정리에서 hostname은 컴퓨터 이름, net user는 사용자 계정을 확인한다."},{"id":"o1","text":"ipconfig /renew / ipconfig /release","why":"두 명령은 각각 DHCP 갱신과 해제에 관한 것이다."},{"id":"o2","text":"net user / hostname","why":"두 명령의 기능을 반대로 연결했다."},{"id":"o3","text":"ping / ipconfig","why":"ping은 연결 진단, ipconfig는 네트워크 설정 조회이다."},{"id":"o4","text":"tracert / ping","why":"경로 확인과 연결 진단을 컴퓨터 이름·계정 조회와 혼동했다."}],"answer":"o0","explanation":"교안의 명령어 정리에서 hostname은 컴퓨터 이름, net user는 사용자 계정을 확인한다.","sources":[{"doc":"G1","pages":[80]},{"doc":"FULL","pages":[8]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q012","chapter":1,"topics":["1-05"],"priority":"핵심","kind":"계산","level":"기본","stem":"1바이트가 8비트일 때 6바이트는 몇 비트인가?","options":[{"id":"o0","text":"8비트","why":"1바이트의 비트 수만 답했다."},{"id":"o1","text":"48비트","why":"6 byte × 8 bit/byte = 48 bit이다. 비트와 바이트를 변환할 때 곱셈 방향을 확인한다."},{"id":"o2","text":"6비트","why":"바이트를 비트로 바꾸는 8배 변환을 생략했다."},{"id":"o3","text":"24비트","why":"바이트당 4비트로 잘못 계산했다."},{"id":"o4","text":"64비트","why":"8바이트에 해당하는 값이며 6바이트가 아니다."}],"answer":"o1","explanation":"6 byte × 8 bit/byte = 48 bit이다. 비트와 바이트를 변환할 때 곱셈 방향을 확인한다.","sources":[{"doc":"G1","pages":[34]}],"caution":"","origin":"교안 규칙 적용·연습용 조건","check":{"kind":"arithmetic","value":48}},{"id":"Q013","chapter":1,"topics":["1-05"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안의 문자 코드 설명에 부합하는 것은?","options":[{"id":"o0","text":"문자 코드는 케이블의 길이를 나타낸다.","why":"케이블 길이와 문자 표현 규칙은 다른 개념이다."},{"id":"o1","text":"1바이트는 언제나 1비트이다.","why":"교안의 관계는 1바이트=8비트이다."},{"id":"o2","text":"문자와 숫자 사이의 대응 규칙이며, ASCII 예에서 A는 65에 대응한다.","why":"문자 코드는 문자와 수치 표현 사이의 대응이다. 교안은 A와 65의 대응을 예로 든다."},{"id":"o3","text":"A의 코드는 패킷이 도착하는 순서에 따라 달라진다.","why":"패킷 도착 순서와 문자 코드의 대응은 구별해야 한다."},{"id":"o4","text":"비트 하나만으로 모든 문자를 각각 표현할 수 있다.","why":"한 비트는 0 또는 1 두 상태만 표현한다."}],"answer":"o2","explanation":"문자 코드는 문자와 수치 표현 사이의 대응이다. 교안은 A와 65의 대응을 예로 든다.","sources":[{"doc":"G1","pages":[34]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q014","chapter":1,"topics":["1-06"],"priority":"핵심","kind":"개념","level":"기본","stem":"서로 다른 제조사의 통신 시스템이 호환되도록 표준화를 추진하는 가장 직접적인 목적은?","options":[{"id":"o0","text":"모든 네트워크를 한 기관이 소유하게 하기","why":"소유 주체의 단일화가 상호연동의 필수 조건은 아니다."},{"id":"o1","text":"모든 장비의 물리적 크기를 같게 만들기","why":"외형의 동일화가 데이터통신 표준화의 핵심 목적은 아니다."},{"id":"o2","text":"모든 기술을 수정 불가능하게 만들기","why":"기술의 발전을 금지하는 것이 표준화의 목적은 아니다."},{"id":"o3","text":"상호연동성과 호환성 확보","why":"교안은 데이터통신 표준화의 목적을 서로 다른 시스템의 상호연동성과 호환성 유지로 설명한다."},{"id":"o4","text":"통신 규칙을 없애기","why":"표준화는 공통 규칙을 마련하는 것이지 규칙을 없애는 것이 아니다."}],"answer":"o3","explanation":"교안은 데이터통신 표준화의 목적을 서로 다른 시스템의 상호연동성과 호환성 유지로 설명한다.","sources":[{"doc":"G1","pages":[11]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q015","chapter":1,"topics":["1-06"],"priority":"핵심","kind":"비교","level":"표준","stem":"De jure와 De facto 표준을 바르게 비교한 것은?","options":[{"id":"o0","text":"De jure는 어떤 단체의 승인도 받지 않은 규칙이다.","why":"공식적인 권위를 인정받은 기관·단체가 제정한다는 정의와 반대이다."},{"id":"o1","text":"De facto는 사용자에게 전혀 사용되지 않는 표준이다.","why":"널리 사용된다는 사실이 De facto의 핵심이다."},{"id":"o2","text":"De jure: 널리 사용 / De facto: 공인 기관만 제정","why":"두 개념의 구분을 뒤바꿨다."},{"id":"o3","text":"둘 다 반드시 법원 판결로만 만들어진다.","why":"교안은 공식 기관의 제정과 사실상 널리 사용되는 표준을 구분한다."},{"id":"o4","text":"De jure: 공인 기관이 제정 / De facto: 널리 사용되어 사실상 형성","why":"공식적인 제정 권위와 시장·사용상의 사실상 정착을 구분한다."}],"answer":"o4","explanation":"공식적인 제정 권위와 시장·사용상의 사실상 정착을 구분한다.","sources":[{"doc":"G1","pages":[11]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q016","chapter":1,"topics":["1-07"],"priority":"핵심","kind":"상황","level":"기본","stem":"몸에 부착한 여러 의료 센서를 연결한 네트워크에 가장 직접적으로 해당하는 교안의 분류는?","options":[{"id":"o0","text":"BAN","why":"몸이나 옷에 부착한 장치들로 구성되는 인체 통신망이다."},{"id":"o1","text":"LAN","why":"건물·대학 등 제한된 지역의 근거리 통신망이다."},{"id":"o2","text":"PAN","why":"교안에서는 약 10m 이내의 개인 활동 공간을 중심으로 한 통신망이다."},{"id":"o3","text":"WAN","why":"도시 간·국가 간 등 광범위한 지역을 연결하는 통신망이다."},{"id":"o4","text":"MAN","why":"도시권 규모를 연결하는 통신망이다."}],"answer":"o0","explanation":"몸이나 옷에 부착한 장치들로 구성되는 인체 통신망이다.","sources":[{"doc":"G1","pages":[10]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q017","chapter":1,"topics":["1-07"],"priority":"핵심","kind":"상황","level":"기본","stem":"여러 도시 또는 서로 다른 국가의 네트워크를 넓은 지역에 걸쳐 연결한 것은?","options":[{"id":"o0","text":"MAN","why":"도시권 규모를 연결하는 통신망이다."},{"id":"o1","text":"WAN","why":"도시 간·국가 간 등 광범위한 지역을 연결하는 통신망이다."},{"id":"o2","text":"PAN","why":"교안에서는 약 10m 이내의 개인 활동 공간을 중심으로 한 통신망이다."},{"id":"o3","text":"BAN","why":"몸이나 옷에 부착한 장치들로 구성되는 인체 통신망이다."},{"id":"o4","text":"LAN","why":"건물·대학 등 제한된 지역의 근거리 통신망이다."}],"answer":"o1","explanation":"도시 간·국가 간 등 광범위한 지역을 연결하는 통신망이다.","sources":[{"doc":"G1","pages":[7,8,9,10]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q018","chapter":1,"topics":["1-07"],"priority":"핵심","kind":"비교","level":"표준","stem":"교안의 범위 구분과 예시를 올바르게 연결한 것은?","options":[{"id":"o0","text":"MAN: 개인 주변 / PAN: 도시권 / LAN: 국가 간","why":"PAN·MAN·WAN의 범위를 서로 바꾼 조합이다."},{"id":"o1","text":"LAN은 반드시 모든 국가를 연결해야 한다.","why":"LAN은 지리적으로 제한된 곳의 근거리 네트워크이다."},{"id":"o2","text":"MAN: 도시권 / PAN: 개인 활동 공간 / LAN: 건물·인접 지역","why":"MAN은 도시권, PAN은 개인 주변, LAN은 제한된 지역이라는 범위 기준으로 구별한다."},{"id":"o3","text":"MAN: 인체 / PAN: 국가 간 / LAN: 도시권","why":"각각 BAN·WAN·MAN에 가까운 범위를 잘못 연결했다."},{"id":"o4","text":"MAN·PAN·LAN은 모두 인체 통신망만 뜻한다.","why":"인체 통신망은 BAN이다."}],"answer":"o2","explanation":"MAN은 도시권, PAN은 개인 주변, LAN은 제한된 지역이라는 범위 기준으로 구별한다.","sources":[{"doc":"G1","pages":[7,8,9,10]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q019","chapter":1,"topics":["1-08"],"priority":"핵심","kind":"개념","level":"기본","stem":"교안이 IPv6를 사물인터넷과 연결하여 설명하는 핵심 이유는?","options":[{"id":"o0","text":"장치에 통신 기능이 없어도 자동으로 데이터가 전달되기 때문이다.","why":"사물인터넷도 통신 기능과 네트워크 연결이 필요하다."},{"id":"o1","text":"모든 전송매체를 없애기 때문이다.","why":"IPv6 주소 체계가 매체의 필요성을 없애지는 않는다."},{"id":"o2","text":"패킷 대신 오직 종이 문서만 전달하기 때문이다.","why":"네트워크 프로토콜과 무관한 설명이다."},{"id":"o3","text":"많은 장치가 상호 통신할 수 있도록 충분한 IP 주소 공간을 제공하기 때문이다.","why":"교안은 많은 디바이스에 주소를 제공할 수 있다는 점을 IPv6와 사물인터넷의 연결 근거로 든다."},{"id":"o4","text":"IPv4의 주소 공간을 더 줄이기 때문이다.","why":"주소 공간 제약을 보완하는 방향이지 더 줄이는 것이 아니다."}],"answer":"o3","explanation":"교안은 많은 디바이스에 주소를 제공할 수 있다는 점을 IPv6와 사물인터넷의 연결 근거로 든다.","sources":[{"doc":"G1","pages":[22,23]}],"caution":"첨부 교안의 기술 도입 이유를 묻는다. 현재 보급률이나 기관 현황을 뜻하지 않는다.","origin":"첨부 자료 기반 재구성"},{"id":"Q020","chapter":1,"topics":["1-09"],"priority":"핵심","kind":"개념","level":"기본","stem":"Wireshark에서 캡처된 패킷이 한 행에 하나씩 표시되는 영역은?","options":[{"id":"o0","text":"표시 필터 입력란","why":"어떤 패킷을 화면에 표시할지 조건을 입력하는 곳이다."},{"id":"o1","text":"네트워크 어댑터 목록","why":"캡처할 인터페이스를 선택하기 위한 목록이다."},{"id":"o2","text":"패킷 상세","why":"선택한 패킷의 프로토콜 계층과 필드를 트리 형태로 해석하는 영역이다."},{"id":"o3","text":"패킷 데이터","why":"선택한 패킷의 원시 데이터 내용을 확인하는 영역이다."},{"id":"o4","text":"패킷 리스트","why":"캡처된 패킷 목록을 행 단위로 표시하고 분석할 패킷을 고르는 영역이다."}],"answer":"o4","explanation":"캡처된 패킷 목록을 행 단위로 표시하고 분석할 패킷을 고르는 영역이다.","sources":[{"doc":"G1","pages":[53,57,58,60]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q021","chapter":1,"topics":["1-09"],"priority":"핵심","kind":"상황","level":"표준","stem":"선택한 패킷의 Ethernet II 필드 의미를 트리로 보고, 대응하는 원시 바이트도 확인하려 한다. 올바른 영역 연결은?","options":[{"id":"o0","text":"패킷 상세에서 필드 해석 / 패킷 데이터에서 원시 바이트 확인","why":"상세 영역은 계층별 해석이고 데이터 영역은 그 해석의 바탕이 되는 실제 데이터이다."},{"id":"o1","text":"패킷 상세에는 파일명만 표시된다.","why":"상세 영역에는 프로토콜 계층에 따른 패킷 의미가 표시된다."},{"id":"o2","text":"패킷 리스트만으로 모든 필드의 상세 트리를 표시","why":"리스트는 목록이며, 상세한 트리 해석은 별도의 상세 영역이다."},{"id":"o3","text":"패킷 데이터에서 인터페이스 설치 / 패킷 리스트에서 전압 조절","why":"어느 영역도 장치 설치나 전압 조절 기능으로 설명되지 않는다."},{"id":"o4","text":"표시 필터에서 모든 원시 바이트 / 어댑터 목록에서 필드 해석","why":"필터 입력란과 어댑터 목록은 분석 내용 표시 영역이 아니다."}],"answer":"o0","explanation":"상세 영역은 계층별 해석이고 데이터 영역은 그 해석의 바탕이 되는 실제 데이터이다.","sources":[{"doc":"G1","pages":[60]},{"doc":"G4","pages":[45,46]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q022","chapter":1,"topics":["1-10"],"priority":"핵심","kind":"상황","level":"기본","stem":"교안의 네트워크 준비·설정·테스트 순서를 바르게 나열한 것은?","options":[{"id":"o0","text":"설정 확인 → 모든 장치 초기화 → 테스트 생략","why":"필요한 장치의 연결 준비와 최종 검증이 빠졌다."},{"id":"o1","text":"하드웨어·NIC 준비 → 유선/무선 연결 → 설정 확인 → 통신 테스트","why":"장치와 매체를 준비하고 연결한 다음, 설정을 확인하고 최종적으로 통신을 테스트한다."},{"id":"o2","text":"패킷 삭제 → 문자 코드 변경 → 표준화 기구 설립","why":"네트워크 연결 설정과 관련 없는 절차이다."},{"id":"o3","text":"통신 테스트 → NIC 제거 → 케이블 제거 → 설정 확인","why":"통신에 필요한 하드웨어를 제거하는 것은 제시된 설정 절차가 아니다."},{"id":"o4","text":"하드웨어 준비 → 연결 여부와 관계없이 완료 처리","why":"실제 연결·설정·테스트 단계가 필요하다."}],"answer":"o1","explanation":"장치와 매체를 준비하고 연결한 다음, 설정을 확인하고 최종적으로 통신을 테스트한다.","sources":[{"doc":"G1","pages":[63]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q023","chapter":1,"topics":["1-11"],"priority":"확장","kind":"비교","level":"기본","stem":"하드웨어 분석 도구와 소프트웨어 분석 도구에 대한 교안의 비교로 옳은 것은?","options":[{"id":"o0","text":"둘 다 패킷이나 네트워크 상태를 확인할 수 없다.","why":"네트워크 분석 도구의 목적과 반대이다."},{"id":"o1","text":"하드웨어 분석 도구는 반드시 문서 편집기이다.","why":"문서 편집기는 전용 하드웨어 네트워크 분석 장비의 정의가 아니다."},{"id":"o2","text":"하드웨어는 직접 연결하는 휴대형 장비, 소프트웨어는 PC·서버에 설치하고 NIC를 이용한다.","why":"교안의 구분은 장비형 분석 도구와 컴퓨터에 설치하여 인터페이스를 통해 분석하는 도구이다."},{"id":"o3","text":"소프트웨어 분석 도구는 네트워크 데이터에 접근하지 않는다.","why":"NIC를 통해 네트워크에 접속하여 데이터를 분석한다."},{"id":"o4","text":"Wireshark는 케이블 그 자체이다.","why":"Wireshark는 교안에서 사용하는 소프트웨어 분석 도구이다."}],"answer":"o2","explanation":"교안의 구분은 장비형 분석 도구와 컴퓨터에 설치하여 인터페이스를 통해 분석하는 도구이다.","sources":[{"doc":"G1","pages":[35,36]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q024","chapter":1,"topics":["1-12"],"priority":"확장","kind":"개념","level":"기본","stem":"교안에서 전기통신 표준화 역할을 맡는 ITU의 부문은?","options":[{"id":"o0","text":"ITU-D","why":"전기통신 개발 부문이다."},{"id":"o1","text":"ITU-R","why":"전파통신 부문이다. 전기통신 표준화 부문과 구별한다."},{"id":"o2","text":"NIST","why":"측정·정보처리·보안 표준과 관련되고 교안은 FIPS·DES·AES를 예로 든다."},{"id":"o3","text":"ITU-T","why":"ITU의 전기통신 표준화 부문이며 V·X 시리즈 등이 관련된다."},{"id":"o4","text":"ANSI","why":"미국 산업 표준 관련 기관으로 교안은 ASCII를 대표 예로 든다."}],"answer":"o3","explanation":"ITU의 전기통신 표준화 부문이며 V·X 시리즈 등이 관련된다.","sources":[{"doc":"G1","pages":[12,14,15]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q025","chapter":1,"topics":["1-12"],"priority":"확장","kind":"비교","level":"표준","stem":"표준화 기구와 교안의 대표 설명을 바르게 연결한 것은?","options":[{"id":"o0","text":"ANSI: 국제 장기 인터넷 연구 / NIST: 인터넷 초안 WG","why":"IRTF·IETF 관련 설명을 다른 기관과 뒤섞었다."},{"id":"o1","text":"ISO: MAC 학습 / ANSI: 전압 증폭 / NIST: 토큰 전달","why":"네트워크 장치·접근 방식의 기능을 기구 역할과 혼동했다."},{"id":"o2","text":"NIST: 모든 RFC를 인터넷 표준으로 자동 승인","why":"모든 RFC가 표준인 것도 아니며, 제시된 NIST 역할도 아니다."},{"id":"o3","text":"ISO: DHCP 주소 갱신 / ANSI: 패킷 캡처 / NIST: 링 절단","why":"표준화 기구가 하는 일과 개별 장치·도구 작업은 다르다."},{"id":"o4","text":"ISO: 국제 표준 / ANSI: ASCII / NIST: FIPS·DES·AES","why":"각 기구의 대표 기능과 예시를 묶은 조합이다."}],"answer":"o4","explanation":"각 기구의 대표 기능과 예시를 묶은 조합이다.","sources":[{"doc":"G1","pages":[14,15]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q026","chapter":1,"topics":["1-13"],"priority":"확장","kind":"비교","level":"기본","stem":"IETF와 IRTF를 교안의 역할에 맞게 구분한 것은?","options":[{"id":"o0","text":"IETF: 인터넷 표준화 / IRTF: 장기 연구","why":"IETF는 인터넷 기술·절차의 표준화를, IRTF는 장기 연구 과제를 담당하는 것으로 설명된다."},{"id":"o1","text":"IRTF는 광신호를 증폭하는 장치이다.","why":"장기 인터넷 연구 기구와 중계기의 역할을 혼동했다."},{"id":"o2","text":"둘 다 MAC 주소를 학습하는 스위치이다.","why":"두 명칭은 인터넷 관련 조직이지 장치가 아니다."},{"id":"o3","text":"IETF: 장기 연구만 / IRTF: 표준화만","why":"두 기구의 주된 역할을 반대로 연결했다."},{"id":"o4","text":"IETF는 반드시 비공개 제조사 한 곳만 참여한다.","why":"교안은 자발적 참여에 기반한 개방형 공동체로 설명한다."}],"answer":"o0","explanation":"IETF는 인터넷 기술·절차의 표준화를, IRTF는 장기 연구 과제를 담당하는 것으로 설명된다.","sources":[{"doc":"G1","pages":[17]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q027","chapter":1,"topics":["1-13"],"priority":"확장","kind":"개념","level":"표준","stem":"RFC와 인터넷 표준의 관계에 대한 교안의 설명으로 옳은 것은?","options":[{"id":"o0","text":"RFC에는 문서 식별 번호가 부여되지 않는다.","why":"교안은 RFC 문서마다 일련번호가 부여된다고 설명한다."},{"id":"o1","text":"모든 RFC가 인터넷 표준인 것은 아니다.","why":"교안은 표준 트랙 외에도 정보·실험·역사 관련 RFC를 설명한다. RFC라는 형식만으로 최종 표준이라고 단정할 수 없다."},{"id":"o2","text":"실험 관련 RFC는 모두 이미 폐기된 문서만 뜻한다.","why":"실험 문서는 진행 중인 연구·개발이나 실험 목적을 다룬다."},{"id":"o3","text":"RFC 번호를 받으면 모두 즉시 최종 인터넷 표준이 된다.","why":"정보·실험 등 다른 상태의 RFC가 존재한다."},{"id":"o4","text":"정보 제공 목적의 RFC는 있을 수 없다.","why":"정보 관련 RFC가 교안에 명시되어 있다."}],"answer":"o1","explanation":"교안은 표준 트랙 외에도 정보·실험·역사 관련 RFC를 설명한다. RFC라는 형식만으로 최종 표준이라고 단정할 수 없다.","sources":[{"doc":"G1","pages":[18,19]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q028","chapter":1,"topics":["1-14"],"priority":"확장","kind":"개념","level":"기본","stem":"교안이 제시한 인터넷 발전 사건의 순서로 옳은 것은?","options":[{"id":"o0","text":"세 사건은 모두 1969년에 동시에 일어났다.","why":"교안은 각각 1969·1983·1986년으로 구분한다."},{"id":"o1","text":"TCP/IP 공식 채택 → ARPANET → NSFNET","why":"ARPANET이 TCP/IP 공식 채택보다 먼저이다."},{"id":"o2","text":"ARPANET(1969) → TCP/IP 공식 채택(1983) → NSFNET(1986)","why":"교안 p.20에 제시된 세 사건의 연도를 시간순으로 나열한 것이다."},{"id":"o3","text":"ARPANET → NSFNET → TCP/IP 공식 채택","why":"1983년 채택이 1986년 NSFNET보다 먼저이다."},{"id":"o4","text":"NSFNET → TCP/IP 공식 채택 → ARPANET","why":"세 사건을 역순으로 나열했다."}],"answer":"o2","explanation":"교안 p.20에 제시된 세 사건의 연도를 시간순으로 나열한 것이다.","sources":[{"doc":"G1","pages":[20]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q029","chapter":1,"topics":["1-15"],"priority":"확장","kind":"개념","level":"기본","stem":"교안의 HTTP 패킷 실습에서 표시 필터와 기본 캡처 저장 확장자를 바르게 연결한 것은?","options":[{"id":"o0","text":"ping / .xlsx","why":"ping은 연결 진단 명령이며 캡처 표시 필터가 아니다."},{"id":"o1","text":"net user / .mp3","why":"사용자 계정 명령과 오디오 확장자는 이 실습의 답이 아니다."},{"id":"o2","text":"ipconfig / .jpg","why":"네트워크 설정 명령과 이미지 확장자를 잘못 연결했다."},{"id":"o3","text":"http / .pcapng","why":"표시 필터에 http를 입력하고, 기본 저장 형식은 .pcapng로 제시되어 있다."},{"id":"o4","text":"hostname / .docx","why":"hostname은 컴퓨터 이름 확인 명령이며 .docx는 제시된 캡처 형식이 아니다."}],"answer":"o3","explanation":"표시 필터에 http를 입력하고, 기본 저장 형식은 .pcapng로 제시되어 있다.","sources":[{"doc":"G1","pages":[57,61]}],"caution":"교안의 HTTP 실습 조건이다. 모든 웹 통신이 이 필터에 표시된다는 뜻은 아니다.","origin":"첨부 자료 기반 재구성"},{"id":"Q030","chapter":1,"topics":["1-15"],"priority":"확장","kind":"상황","level":"표준","stem":"캐시에 저장된 웹 페이지를 열었더니 기대한 통신 패킷이 보이지 않는다. 교안에서 제시한 설명과 대응은?","options":[{"id":"o0","text":"통신하지 않는 다른 인터페이스를 선택하면 해결된다.","why":"교안은 실제 통신이 발생하는 올바른 인터페이스 선택을 강조한다."},{"id":"o1","text":"표시 필터 이름을 컴퓨터 이름으로 바꾸면 서버 캐시가 사라진다.","why":"표시 필터와 웹 캐시 재요청은 서로 다른 기능이다."},{"id":"o2","text":"패킷 데이터 영역에 아무 문자나 쓰면 서버가 응답한다.","why":"분석 화면은 서버 통신을 그런 방식으로 생성하는 입력란이 아니다."},{"id":"o3","text":"패킷이 없으면 반드시 NIC가 물리적으로 파손된 것이다.","why":"캐시라는 다른 원인이 제시되어 있으므로 단정할 수 없다."},{"id":"o4","text":"캐시로 표시되어 통신이 생기지 않았을 수 있으므로 슈퍼 리로드로 서버에서 다시 읽는다.","why":"교안은 캐시 사용 때문에 예상한 통신이 발생하지 않을 수 있다고 설명하며 강제 새로고침을 제시한다."}],"answer":"o4","explanation":"교안은 캐시 사용 때문에 예상한 통신이 발생하지 않을 수 있다고 설명하며 강제 새로고침을 제시한다.","sources":[{"doc":"G1","pages":[54,56]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q031","chapter":2,"topics":["2-11"],"priority":"확장","kind":"개념","level":"기본","stem":"교안이 제시한 네트워크 구성 요소의 세 범주를 바르게 묶은 것은?","options":[{"id":"o0","text":"컴퓨터·서버 / 접속 장치 / 전송매체","why":"컴퓨터의 애플리케이션이 데이터를 생성·처리하고, 접속 장치가 전달하며, 매체가 연결 통로를 제공한다."},{"id":"o1","text":"SYN / STX / ETX","why":"문자 지향 동기화의 제어 문자이다."},{"id":"o2","text":"표본화 / 양자화 / 부호화","why":"PCM의 변환 단계이다."},{"id":"o3","text":"세션 / 표현 / 응용","why":"OSI의 상위 세 계층이며 네트워크 구성 요소의 세 범주가 아니다."},{"id":"o4","text":"진폭 / 위상 / 주파수","why":"아날로그 신호의 특징에 관한 구분이다."}],"answer":"o0","explanation":"컴퓨터의 애플리케이션이 데이터를 생성·처리하고, 접속 장치가 전달하며, 매체가 연결 통로를 제공한다.","sources":[{"doc":"G2","pages":[5,6,8]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q032","chapter":2,"topics":["2-03"],"priority":"핵심","kind":"상황","level":"표준","stem":"연구실 내부 PC들을 연결한 장치가 아니라, 서로 다른 연구실 네트워크 사이의 IP 경로를 선택하는 장치는?","options":[{"id":"o0","text":"스위치","why":"한 네트워크 내부에서 프레임을 전달하며 수신지 MAC과 포트 정보를 활용한다."},{"id":"o1","text":"라우터","why":"서로 다른 네트워크를 연결하고 IP 주소에 따라 전달 경로를 선택한다."},{"id":"o2","text":"AP","why":"무선 단말에 유선 이더넷 네트워크 접근을 제공하는 접속점이다."},{"id":"o3","text":"중계기","why":"약해진 신호를 복원·증폭하여 다음 구간으로 재전송하고 거리를 연장한다."},{"id":"o4","text":"게이트웨이","why":"서로 다른 종류·프로토콜의 네트워크 사이에서 프로토콜을 변환하여 정보를 교환한다."}],"answer":"o1","explanation":"서로 다른 네트워크를 연결하고 IP 주소에 따라 전달 경로를 선택한다.","sources":[{"doc":"G2","pages":[6,7,33]}],"caution":"","origin":"교안 규칙 적용·연습용 조건"},{"id":"Q033","chapter":2,"topics":["2-03"],"priority":"핵심","kind":"개념","level":"기본","stem":"한 네트워크 내부에서 여러 PC의 데이터 전달을 담당하는 기본 접속 장치는?","options":[{"id":"o0","text":"라우터","why":"서로 다른 네트워크를 연결하고 IP 주소에 따라 전달 경로를 선택한다."},{"id":"o1","text":"AP","why":"무선 단말에 유선 이더넷 네트워크 접근을 제공하는 접속점이다."},{"id":"o2","text":"스위치","why":"한 네트워크 내부에서 프레임을 전달하며 수신지 MAC과 포트 정보를 활용한다."},{"id":"o3","text":"게이트웨이","why":"서로 다른 종류·프로토콜의 네트워크 사이에서 프로토콜을 변환하여 정보를 교환한다."},{"id":"o4","text":"중계기","why":"약해진 신호를 복원·증폭하여 다음 구간으로 재전송하고 거리를 연장한다."}],"answer":"o2","explanation":"한 네트워크 내부에서 프레임을 전달하며 수신지 MAC과 포트 정보를 활용한다.","sources":[{"doc":"G2","pages":[6,7]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q034","chapter":2,"topics":["2-10"],"priority":"핵심","kind":"개념","level":"기본","stem":"인트라넷에 관한 교안의 정의로 가장 적절한 것은?","options":[{"id":"o0","text":"모든 인터넷 사용자가 반드시 접근 가능한 공개망","why":"사설 네트워크라는 성격을 놓친 설명이다."},{"id":"o1","text":"물리적 회선 없이 문자 코드만 저장한 파일","why":"인트라넷도 실제 장치와 통신 연결을 이용한다."},{"id":"o2","text":"네트워크 케이블의 제조사 식별 번호","why":"케이블·주소 구조가 아니라 조직의 네트워크 구성에 관한 개념이다."},{"id":"o3","text":"인터넷의 회선과 기반 기술을 활용하여 구축한 사설 네트워크","why":"인트라넷은 사설 네트워크의 성격과 인터넷 기술의 활용을 함께 설명하는 개념이다. 분산된 캠퍼스 연결은 그 예시이다."},{"id":"o4","text":"항상 한 사람의 몸 안에서만 통신하는 네트워크","why":"이것은 인체 통신망의 범위와 혼동한 것이다."}],"answer":"o3","explanation":"인트라넷은 사설 네트워크의 성격과 인터넷 기술의 활용을 함께 설명하는 개념이다. 분산된 캠퍼스 연결은 그 예시이다.","sources":[{"doc":"G2","pages":[12,13]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q035","chapter":2,"topics":["2-04"],"priority":"핵심","kind":"개념","level":"기본","stem":"NIC(LAN 카드)의 기능으로 교안과 부합하는 것은?","options":[{"id":"o0","text":"데이터를 사용자 몰래 모두 삭제하는 것","why":"정상적인 데이터 입출력·송수신 기능과 무관하다."},{"id":"o1","text":"주기와 주파수 사이의 관계식을 변경","why":"신호의 수학적 관계를 변경하는 장치가 아니다."},{"id":"o2","text":"모든 종류의 인터넷 표준 제정","why":"표준화 기구의 역할과 NIC의 기능은 다르다."},{"id":"o3","text":"어떤 매체도 없이 모든 장치를 자동 연결","why":"NIC는 유선 또는 무선 매체에 접속한다."},{"id":"o4","text":"전송매체 접속, 데이터 입출력·송수신, 프로토콜 처리","why":"교안은 NIC를 외부 네트워크와 데이터를 송수신하도록 하는 인터페이스 장치로 설명한다."}],"answer":"o4","explanation":"교안은 NIC를 외부 네트워크와 데이터를 송수신하도록 하는 인터페이스 장치로 설명한다.","sources":[{"doc":"G2","pages":[15]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q036","chapter":2,"topics":["2-04"],"priority":"핵심","kind":"개념","level":"표준","stem":"교안의 MAC 주소 길이와 제조사 할당 주소 구조 설명을 바르게 연결한 것은?","options":[{"id":"o0","text":"48비트 = 6바이트 / 앞 24비트 제조사 관련 코드, 뒤 24비트 장치 식별 부분","why":"교안은 제조사 할당 MAC 주소를 24+24비트로 설명한다. 모든 MAC이 공장 출하값 그대로라는 주장으로 확대하지 않는다."},{"id":"o1","text":"128비트 / 전체가 패킷 일련번호","why":"교안의 MAC 주소 길이·구조와 일치하지 않는다."},{"id":"o2","text":"48비트 = 48바이트 / 앞 24바이트 제조사","why":"비트와 바이트를 같은 단위로 취급했다."},{"id":"o3","text":"6비트 = 48바이트 / 앞 3비트 제조사","why":"6바이트=48비트의 방향과 단위를 바꿨다."},{"id":"o4","text":"32비트 = 4바이트 / 앞 16비트만 제조사","why":"32비트는 교안의 IPv4 주소 길이와 혼동한 값이다."}],"answer":"o0","explanation":"교안은 제조사 할당 MAC 주소를 24+24비트로 설명한다. 모든 MAC이 공장 출하값 그대로라는 주장으로 확대하지 않는다.","sources":[{"doc":"G2","pages":[16,17]},{"doc":"FULL","pages":[10]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q037","chapter":2,"topics":["2-02"],"priority":"핵심","kind":"비교","level":"표준","stem":"더미 허브와 스위칭 허브의 핵심 차이로 옳은 것은?","options":[{"id":"o0","text":"스위칭 허브는 반드시 모든 프레임을 모든 포트로만 보낸다.","why":"수신지 주소로 전달할 포트를 선택하는 기능을 무시했다."},{"id":"o1","text":"더미 허브는 대역폭을 공유하고, 스위칭 허브는 수신지 주소에 따라 점대점으로 전달한다.","why":"교안은 더미 허브의 대역폭 공유 문제에 대비하여 스위칭 허브의 수신지 기반 전달과 포트별 연결을 설명한다."},{"id":"o2","text":"두 장치는 이름만 다르고 전달 방식은 항상 같다.","why":"교안은 공유 방식과 스위칭 방식의 차이를 분명히 구분한다."},{"id":"o3","text":"더미 허브만 수신지 MAC을 학습한다.","why":"MAC 학습은 스위치에서 다루는 기능이며 더미 허브에는 없다."},{"id":"o4","text":"더미 허브는 프로토콜을 변환하는 게이트웨이와 항상 같다.","why":"단순 중계와 프로토콜 변환은 다른 기능이다."}],"answer":"o1","explanation":"교안은 더미 허브의 대역폭 공유 문제에 대비하여 스위칭 허브의 수신지 기반 전달과 포트별 연결을 설명한다.","sources":[{"doc":"G2","pages":[19,21,22]},{"doc":"G4","pages":[32]}],"caution":"","origin":"첨부 자료 기반 재구성"},{"id":"Q038","chapter":2,"topics":["2-02"],"priority":"핵심","kind":"상황","level":"기본","stem":"수신지 MAC을 구분하지 못하고 들어온 신호를 다른 포트에 중계하는 장치의 특징은?","options":[{"id":"o0","text":"스위치의 알려진 수신지 단일 포트 전달","why":"알려진 주소에 따른 선택 전달과 반대되는 상황이다."},{"id":"o1","text":"게이트웨이의 프로토콜 변환","why":"문제에는 서로 다른 프로토콜의 변환이 제시되지 않았다."},{"id":"
