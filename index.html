  function calculateCRC(data,generator,append=true){
    if(!(append?/^[01]{1,64}$/:/^[01]{1,80}$/).test(data))throw new Error(append?'데이터는 0과 1만 사용하여 1–64비트로 입력하세요.':'수신 비트열은 0과 1만 사용하여 1–80비트로 입력하세요.');
    if(!/^1[01]{0,15}1$/.test(generator))throw new Error('생성 비트열은 2–17비트이며 처음과 끝이 1이어야 합니다.');
    const r=generator.length-1,dividend=data+(append?'0'.repeat(r):''),work=dividend.split('').map(Number),g=generator.split('').map(Number),steps=[];
    for(let i=0;i<=work.length-g.length;i++){
      if(work[i]===0)continue;
      const before=work.join('');for(let j=0;j<g.length;j++)work[i+j]^=g[j];
      steps.push({index:i,before,mask:' '.repeat(i)+generator,after:work.join('')});
    }
    const remainder=work.slice(-r).join('').padStart(r,'0');
    return {r,dividend,remainder,steps};
  }
  function crcTool(){
    const el=document.getElementById('crc-output');
    try{const d=document.getElementById('crc-data').value.trim(),g=document.getElementById('crc-generator').value.trim(),c=calculateCRC(d,g),tx=d+c.remainder,rx=calculateCRC(tx,g,false);
      const stepText=c.steps.map((s,i)=>`[${i+1}] 왼쪽에서 ${s.index+1}번째 위치\n  ${s.before}\n⊕ ${s.mask}\n  ${s.after}`).join('\n\n');
      el.innerHTML=`<div class="tool-result"><p>검사 비트 수 r = <b>${c.r}</b></p><p>0을 덧붙인 입력: <strong class="mono">${c.dividend}</strong></p><p>FCS: <strong class="mono">${c.remainder}</strong></p><p>전송 비트열: <strong class="mono">${tx}</strong></p><p>수신 검산 나머지: <strong class="mono">${rx.remainder}</strong></p></div><details><summary>XOR 나눗셈 중간 과정 ${c.steps.length}단계</summary><pre>${h(stepText||'선행 비트가 모두 0이므로 XOR 단계가 없습니다.')}</pre></details><p class="screen-hint">0인 나머지는 이 생성 비트열로 검사했을 때 통과했다는 뜻입니다. 모든 오류가 없다는 절대 보장은 아닙니다.</p>`;
    }catch(err){el.innerHTML=`<p class="field-error">${h(err.message)}</p>`;}
  }
  function encodeWave(scheme,bits,initial=1){
    if(!/^[01]{1,16}$/.test(bits))throw new Error('비트열은 0과 1만 사용하여 1–16비트로 입력하세요.');
    if(!Object.hasOwn(BANK.rules,scheme))throw new Error('부호화 방식을 선택하세요.');
    if(![1,-1].includes(initial))throw new Error('초기 전압을 선택하세요.');
    let level=initial,mark=initial;const levels=[];
    for(const bit of bits){let a,b;
      switch(scheme){
        case 'NRZ-L':a=b=bit==='0'?1:-1;break;
        case 'NRZ-I':if(bit==='1')level=-level;a=b=level;break;
        case 'RZ':a=bit==='1'?1:-1;b=0;break;
        case 'Manchester':a=bit==='0'?1:-1;b=-a;break;
        case '차동 Manchester':if(bit==='0')level=-level;a=level;b=-a;level=b;break;
        case 'AMI':if(bit==='1'){a=b=mark;mark=-mark;}else a=b=0;break;
      }levels.push(a,b);
    }return levels;
  }
  function wavePattern(scheme,levels){const sym={'1':'+V','0':'0V','-1':'−V'};const groups=[];for(let i=0;i<levels.length;i+=2)groups.push(['NRZ-L','NRZ-I','AMI'].includes(scheme)?sym[levels[i]]:sym[levels[i]]+'→'+sym[levels[i+1]]);return groups.join(' | ');}

    switch(act){
      case 'nav':route(button.dataset.route);break;
      case 'theme':state.theme=state.theme==='light'?'dark':'light';save();updateHeader();break;
      case 'chapters-all':state.settings.chapters=state.settings.chapters.length===6?[]:[1,2,3,4,5,6];save();render();break;
      case 'start':{const pool=selectedPool(),n=state.settings.count==='all'?pool.length:Math.min(Number(state.settings.count),pool.length);startSession(samplePool(pool,n),state.settings.mode);break;}
      case 'preset-exam':{state.settings={...DEFAULT_SETTINGS,chapters:[1,2,3,4,5,6],mode:'exam'};save();startSession(samplePool(QUESTIONS,30),'exam');break;}
      case 'resume':route(state.session?.status==='finished'?'results':'quiz');break;
      case 'answer':answer(id,button.dataset.option);break;
      case 'unknown':answer(id,null,true);break;
      case 'prev':moveQuestion(state.session.index-1);break;
      case 'next':moveQuestion(state.session.index+1);break;
      case 'jump':moveQuestion(Number(button.dataset.index));break;
      case 'bookmark':toggleBookmark(id);break;
      case 'finish':finishSession(false);break;
      case 'result':route('results');break;
      case 'review-session':moveQuestion(0);break;
      case 'retry-session':{const ids=state.session.ids.filter(qid=>!state.session.responses[qid]?.correct);startSession(state.settings.shuffleQuestions?shuffled(ids):ids,'study');break;}
      case 'retry-needs':{const ids=QUESTIONS.filter(q=>needsReview(q.id)).map(q=>q.id);startSession(state.settings.shuffleQuestions?shuffled(ids):ids,'study');break;}
      case 'review-filter':ui.reviewFilter=button.dataset.value;ui.reviewPage=0;render();break;
      case 'review-prev':ui.reviewPage--;document.getElementById('review-results').innerHTML=reviewResultsHTML();scrollTop();break;
      case 'review-next':ui.reviewPage++;document.getElementById('review-results').innerHTML=reviewResultsHTML();scrollTop();break;
      case 'practice-review':{const ids=filteredReview().map(q=>q.id);startSession(state.settings.shuffleQuestions?shuffled(ids):ids,'study');break;}
      case 'practice-one':startSession([id],'study');break;
      case 'practice-topic':{const ids=QUESTIONS.filter(q=>q.topics.includes(id)).map(q=>q.id);startSession(state.settings.shuffleQuestions?shuffled(ids):ids,'study');break;}
      case 'crc-calc':crcTool();break;
      case 'wave-calc':waveTool();break;
      case 'export':exportBackup();break;
      case 'import':document.getElementById('backup-import').click();break;
      case 'reset':if(confirm('진도, 오답, 북마크, 메모, 진행 중인 세트와 결과 이력을 모두 지울까요? 이 작업은 되돌릴 수 없습니다.')){const theme=state.theme;state=blankState();state.theme=theme;save();ui.route='home';render();toast('학습 기록을 초기화했습니다.');}break;
      case 'bind-pdf':document.getElementById('pdf-import').click();break;
      case 'openpdf':{const url=pdfFiles.get(button.dataset.doc),p=Number(button.dataset.page);if(url&&isInt(p,1,BANK.docs[button.dataset.doc].pages))window.open(url+'#page='+p,'_blank','noopener');else toast('「공식·자료」에서 해당 PDF를 먼저 연결하세요.');break;}
      case 'print-review':printSet(filteredReview().map(q=>q.id),'복습 노트');break;
      case 'print-session':printSet(state.session.ids,'세트 해설');break;
    }
  });
  document.addEventListener('change',event=>{
    const el=event.target;
    if(el.name==='chapter'){state.settings.chapters=[...document.querySelectorAll('[name="chapter"]:checked')].map(x=>Number(x.value));save();render();}
    else if(el.name==='study-mode'){state.settings.mode=el.value;save();render();}
    else if(el.dataset.setting){const k=el.dataset.setting;if(!Object.hasOwn(DEFAULT_SETTINGS,k))return;let val=el.type==='checkbox'?el.checked:el.value;if(k==='minutes'){val=Number(val);if(!isInt(val,1,240)){toast('시간은 1분부터 240분까지 정수로 설정하세요.');render();return;}}state.settings[k]=val;save();render();}
    else if(el.id==='backup-import'){importBackup(el.files[0]);el.value='';}
    else if(el.id==='pdf-import'){bindPDFs(el.files);el.value='';}
  });
  document.addEventListener('input',event=>{
    const el=event.target;
    if(el.dataset.note&&QMAP.has(el.dataset.note)){state.notes[el.dataset.note]=el.value.slice(0,1000);save();}
    else if(el.id==='review-search'){ui.reviewSearch=el.value;ui.reviewPage=0;document.getElementById('review-results').innerHTML=reviewResultsHTML();}
  });
  document.addEventListener('keydown',event=>{
    if(ui.route!=='quiz'||event.ctrlKey||event.altKey||event.metaKey||event.repeat)return;
    if(event.target.closest('input,select,textarea,[contenteditable="true"],.wave-wrap'))return;
    const s=state.session;if(!s)return;
    if(/^[1-5]$/.test(event.key)){event.preventDefault();answer(s.ids[s.index],s.order[s.ids[s.index]][Number(event.key)-1]);}
    else if(event.key==='ArrowRight'){event.preventDefault();moveQuestion(s.index+1);}
    else if(event.key==='ArrowLeft'){event.preventDefault();moveQuestion(s.index-1);}
    else if(event.key==='Enter'&&!event.target.closest('button,summary,a')){event.preventDefault();if(s.index<s.ids.length-1)moveQuestion(s.index+1);}
  });
  window.addEventListener('beforeunload',save);
  document.addEventListener('visibilitychange',()=>{if(!document.hidden)tick();});
  setInterval(tick,1000);

  // Read-only diagnostics plus the two pure algorithms aid testing and editing.
  window.NetworkQuiz=Object.freeze({version:BANK.version,getState:()=>JSON.parse(JSON.stringify(state)),getBank:()=>JSON.parse(JSON.stringify(BANK)),getRoute:()=>ui.route,algorithms:Object.freeze({calculateCRC,encodeWave,wavePattern}),validateState});
  render();
})();
</script>
</body>
